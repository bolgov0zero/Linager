<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linager</title>
<style>
@font-face{font-family:"Medeo Mono";src:url(fonts/MedeoMonoVariable.woff2) format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:"Medeo Pixel";src:url(fonts/MedeoPixelVariable.woff) format("woff");font-style:normal;font-display:swap}
/* Layout idea: summary strip on top, grid of equal server cards below; pixel type for labels, hard offset shadows, segmented bars. */
:root{
  --bg:#e8ebe5;
  --surface:#f6f7f3;
  --ink:#14181e;
  --muted:#5d6572;
  --line:#14181e;
  --accent:#2b55d9;
  --good:#1e8a4b;
  --warn:#b36f0e;
  --crit:#c4352a;
  --seg-off:#d5d9d0;
  --shade:#c3c8bd;
  --font-display:"Medeo Pixel","Medeo Mono",ui-monospace,Menlo,Consolas,monospace;
  --font-body:"Medeo Mono",ui-monospace,Menlo,Consolas,monospace;
  font-variation-settings:"ELSH" 1;
  font-synthesis:none;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1218;--surface:#171b23;--ink:#e6e9ef;--muted:#8a93a4;--line:#3b4455;
    --accent:#7d9cff;--good:#4fcf86;--warn:#e6b04b;--crit:#ff6d60;--seg-off:#272d39;--shade:#0a0c10;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1218;--surface:#171b23;--ink:#e6e9ef;--muted:#8a93a4;--line:#3b4455;
  --accent:#7d9cff;--good:#4fcf86;--warn:#e6b04b;--crit:#ff6d60;--seg-off:#272d39;--shade:#0a0c10;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:13px;line-height:1.45;min-height:100%}
button,input{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.wrap{max-width:1280px;margin:0 auto;padding:20px 16px 56px;display:flex;flex-direction:column;gap:20px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:32px;height:32px;display:block}
.brand h1{font-family:var(--font-display);font-size:26px;letter-spacing:.02em;line-height:1}
.brand small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.top-r{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.live{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;margin-right:6px}
.live i{width:8px;height:8px;background:var(--good);display:block;animation:blink 2s steps(2,jump-none) infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.live i{animation:none}}

.btn{background:var(--surface);border:2px solid var(--line);padding:7px 12px;cursor:pointer;font-family:var(--font-display);font-size:14px;letter-spacing:.02em;box-shadow:3px 3px 0 var(--shade);transition:none}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shade)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.sm{padding:4px 9px;font-size:13px;box-shadow:2px 2px 0 var(--shade)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* summary */
.sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:2px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:2px;position:relative}
.tile .k{font-family:var(--font-display);font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.tile .v{font-family:var(--font-display);font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .s{color:var(--muted);font-size:12px;min-height:18px}
.tile.alert .v{color:var(--crit)}
.tile.alert::after{content:"";position:absolute;top:-2px;right:-2px;width:10px;height:10px;background:var(--crit)}

/* toolbar */
.bar-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:transparent;border:2px solid var(--line);padding:4px 10px;cursor:pointer;font-family:var(--font-display);font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip:hover:not([aria-pressed="true"]){background:var(--surface)}
.search{background:var(--surface);border:2px solid var(--line);padding:6px 10px;min-width:200px;font-size:13px}
.search::placeholder{color:var(--muted)}

/* grid + card */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.card{background:var(--surface);border:2px solid var(--line);box-shadow:5px 5px 0 var(--shade);padding:16px 14px 12px;display:flex;flex-direction:column;gap:12px;position:relative;min-width:0}
.card[hidden]{display:none}
.card::before{content:"";position:absolute;left:-2px;right:-2px;top:-2px;height:5px;background:var(--line)}
.card[data-level="ok"]::before{background:var(--line)}
.card[data-level="warn"]::before{background:var(--warn)}
.card[data-level="crit"]::before{background:var(--crit)}
.card[data-level="off"]::before{background:var(--muted)}
.card[data-level="off"] .metrics,.card[data-level="off"] .spark-wrap{opacity:.45}
.card.dragging{opacity:.45}
.editing .card{cursor:grab;outline:2px dashed var(--muted);outline-offset:3px}

.c-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.c-title{display:flex;align-items:center;gap:9px;min-width:0}
.dot{width:10px;height:10px;flex:none;background:var(--good)}
.card[data-level="warn"] .dot{background:var(--warn)}
.card[data-level="crit"] .dot{background:var(--crit)}
.card[data-level="off"] .dot{background:var(--muted)}
.c-title h3{font-family:var(--font-display);font-size:20px;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-sub{color:var(--muted);font-size:12px;margin-top:-6px}
.c-edit{display:none;gap:4px;flex:none}
.editing .c-edit{display:flex}
.ib{width:26px;height:26px;background:var(--bg);border:2px solid var(--line);cursor:pointer;font-family:var(--font-display);font-size:16px;line-height:1;padding:0;display:grid;place-items:center}
.ib:hover{background:var(--ink);color:var(--bg)}
.ib.del:hover{background:var(--crit);border-color:var(--crit);color:#fff}

.tags{display:flex;flex-wrap:wrap;gap:6px;min-height:24px;align-content:flex-start}
.tag{border:2px solid var(--line);padding:0 6px;font-size:11px;line-height:18px;white-space:nowrap}
.tag.ok{border-color:var(--good);color:var(--good)}
.tag.warn{border-color:var(--warn);color:var(--warn)}
.tag.crit{border-color:var(--crit);color:var(--crit)}
.tag.off{border-color:var(--muted);color:var(--muted)}

.metrics{display:flex;flex-direction:column;gap:7px}
.m{display:grid;grid-template-columns:44px 1fr 40px;align-items:center;gap:8px}
.ml{font-family:var(--font-display);font-size:13px;color:var(--muted);letter-spacing:.06em}
.mv{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.bar{display:flex;gap:2px;height:12px}
.bar i{flex:1;background:var(--seg-off);display:block}
.bar[data-level="ok"] i.on{background:var(--accent)}
.bar[data-level="warn"] i.on{background:var(--warn)}
.bar[data-level="crit"] i.on{background:var(--crit)}

.spark-wrap{display:flex;flex-direction:column;gap:5px;border-top:2px dashed var(--seg-off);padding-top:10px}
.spark-wrap canvas{width:100%;height:26px;display:block;image-rendering:pixelated}
.net{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.net b{color:var(--ink);font-weight:500}

.c-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:2px solid var(--line);margin:0 -14px -12px;padding:9px 14px}
.up{color:var(--muted);font-size:12px}
.acts{display:flex;gap:6px}

.empty{border:2px dashed var(--line);padding:32px 16px;text-align:center;color:var(--muted);display:none}
.empty.show{display:block}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,12,16,.55);display:none;align-items:flex-start;justify-content:center;padding:48px 16px 16px;z-index:20;overflow:auto}
.modal.open{display:flex}
.sheet{background:var(--surface);border:2px solid var(--line);box-shadow:6px 6px 0 var(--shade);width:100%;max-width:560px;display:flex;flex-direction:column}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:2px solid var(--line)}
.sheet-h h2{font-family:var(--font-display);font-size:20px}
.sec{padding:14px;display:flex;flex-direction:column;gap:10px}
.sec+.sec{border-top:2px dashed var(--seg-off)}
.sec h4{margin:0;font-family:var(--font-display);font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;border:2px solid var(--line);padding:8px 10px;flex-wrap:wrap}
.row .nm{font-family:var(--font-display);font-size:16px;font-weight:600}
.row .sm{color:var(--muted);font-size:12px}
.pend{display:flex;flex-direction:column;gap:8px;border:2px solid var(--line);padding:10px}
.pend .line{display:flex;gap:8px;flex-wrap:wrap}
.pend input{flex:1;min-width:140px;background:var(--bg);border:2px solid var(--line);padding:6px 10px;letter-spacing:.12em;text-transform:uppercase}
.err{color:var(--crit);font-size:12px;min-height:16px}
.none{color:var(--muted);font-size:12px}

/* toast */
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;display:none;align-items:center;gap:14px;z-index:30;max-width:calc(100% - 32px);box-shadow:4px 4px 0 var(--shade)}
.toast.show{display:flex}
.toast button{background:none;border:0;color:var(--bg);text-decoration:underline;cursor:pointer;padding:0}

/* big display type uses the grid dot shape, small pixel text stays square for legibility */
.brand h1,.tile .v,.c-title h3,.d-ttl h2,.big,.ifh .nm,.tbl .nm{font-variation-settings:"ELSH" 40}
/* server detail */
body.in-detail .dv,body.in-detail #editBtn,body.in-detail #addBtn,body.in-updates .dv,body.in-updates #editBtn,body.in-updates #addBtn{display:none}
#updates{display:none}
body.in-updates #updates{display:flex;flex-direction:column;gap:16px}
#detail{display:none}
body.in-detail #detail{display:flex;flex-direction:column;gap:16px}
.card h3{cursor:pointer}
.card h3:hover{text-decoration:underline}
.editing .card h3{cursor:inherit;text-decoration:none}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn:disabled:hover{background:var(--surface);color:var(--ink)}
#dhead{display:flex;flex-direction:column;gap:10px}
.d-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.d-ttl{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.d-ttl h2{font-family:var(--font-display);font-size:30px;line-height:1}
#detail[data-level="warn"] .dot{background:var(--warn)}
#detail[data-level="crit"] .dot{background:var(--crit)}
#detail[data-level="off"] .dot{background:var(--muted)}
.banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;border:2px solid var(--warn);color:var(--warn);padding:8px 12px}
.banner span{color:var(--ink)}
.tabs{display:flex;overflow-x:auto;gap:2px;margin-bottom:-14px;position:relative;z-index:1;padding-right:2px}
.tab{background:none;border:2px solid transparent;border-bottom:0;padding:8px 14px;cursor:pointer;font-family:var(--font-display);font-size:15px;white-space:nowrap;color:var(--muted)}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--surface);border-color:var(--line);color:var(--ink);padding-bottom:10px;margin-bottom:-2px}
.panel{background:var(--surface);border:2px solid var(--line);padding:16px;min-height:300px;box-shadow:5px 5px 0 var(--shade)}
.ov{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}
.box{border:2px solid var(--line);background:var(--bg);padding:12px;display:flex;flex-direction:column;gap:9px;min-width:0}
.box h4{margin:0;font-family:var(--font-display);font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.big{font-family:var(--font-display);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.box canvas{width:100%;height:64px;display:block;image-rendering:pixelated}
.sm2{color:var(--muted);font-size:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;margin:0;font-size:12px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{font-family:var(--font-display);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:2px solid var(--line);white-space:nowrap}
.tbl td{padding:7px 8px;border-bottom:2px dashed var(--seg-off);vertical-align:middle}
.tbl td.r,.tbl th.r{text-align:right;font-variant-numeric:tabular-nums}
.tbl .nm{font-family:var(--font-display);font-size:15px;font-weight:600}
.st{display:inline-block;border:2px solid var(--muted);color:var(--muted);padding:0 6px;font-size:11px;line-height:18px;white-space:nowrap}
.st.active{border-color:var(--good);color:var(--good)}
.st.failed{border-color:var(--crit);color:var(--crit)}
.st.busy{border-color:var(--warn);color:var(--warn)}
.tools{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.tools .search{min-width:180px}
select.search{padding:5px 8px}
.term,.logs{--t-bg:#0b0e13;--t-fg:#d5dae3;--t-dim:#7f8898;--t-ok:#6fd68f;--t-err:#ff7a6e;--t-warn:#e6b04b;--t-pr:#8fb0ff;background:var(--t-bg);color:var(--t-fg);border:2px solid var(--line);overflow:auto;padding:12px;font-size:13px}
.term{height:420px;cursor:text}
.term:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.term pre,.logs pre{margin:0;font:inherit;white-space:pre-wrap;word-break:break-word}
.term pre span{display:block;min-height:1.45em}
.term .cmd{color:var(--t-pr)}
.term .dim{color:var(--t-dim)}
.term .ok{color:var(--t-ok)}
.term .err{color:var(--t-err)}
.tin{display:flex;gap:0;align-items:center}
.tin .pr{color:var(--t-pr);white-space:pre}
.tin input{flex:1;min-width:0;background:transparent;border:0;color:var(--t-fg);outline:0;font:inherit;caret-color:var(--t-pr);padding:0}
.tbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.tbar .dd{display:inline-block;width:8px;height:8px;background:var(--good);margin-right:8px}
.hint{color:var(--muted);font-size:12px;margin-top:10px}
.logs{height:380px}
.logs.short{height:150px;margin-top:14px}
.logs .row2{display:block;line-height:1.5}
.logs .lt{color:var(--t-dim)}
.logs .lu{color:var(--t-pr);margin:0 8px}
.logs .warn{color:var(--t-warn)}
.logs .err{color:var(--t-err)}
.pk-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.offl{display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding:24px 4px}
.offl p{color:var(--muted);max-width:60ch}

.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px;font-size:13px}
.crumbs button{background:none;border:0;padding:2px 4px;cursor:pointer;color:var(--accent);text-decoration:underline;font:inherit}
.crumbs span{color:var(--muted)}
.fname{background:none;border:0;padding:0;cursor:pointer;font:inherit;font-weight:500;color:var(--ink);text-align:left;display:inline-flex;align-items:center}
.fname:hover{text-decoration:underline}
.ico{display:inline-block;width:12px;height:9px;margin-right:9px;background:var(--accent);flex:none}
.ico.f{background:var(--muted);width:9px;height:12px;margin:0 10px 0 1.5px}
.editor{width:100%;height:380px;resize:vertical;background:#0b0e13;color:#d5dae3;border:2px solid var(--line);padding:12px;font:13px/1.5 var(--font-body);outline:0;display:block}
.editor:focus{outline:2px solid var(--accent);outline-offset:2px}
.inl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.inl input,.inl select{background:var(--bg);border:2px solid var(--line);padding:5px 8px;min-width:0;font-size:13px}
.inl input.grow{flex:1;min-width:140px}
.inl input.w{width:170px}
.tbl td.r{white-space:nowrap}
.tbl td .ib{display:inline-grid;vertical-align:middle}
.rule{font-size:12px;word-break:break-word}
.chh{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin:20px 0 6px}
.chh.first{margin-top:0}
.chh b{font-family:var(--font-display);font-size:17px;font-weight:600}
.chh .sm2{margin-left:8px}
.ifh{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.ifh .nm{font-family:var(--font-display);font-size:22px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.fgrid input,.fgrid select{background:var(--surface);border:2px solid var(--line);padding:5px 8px;font-size:13px;color:var(--ink);min-width:0}
.fgrid input:disabled{opacity:.45}
.fgrid .full{grid-column:1/-1}
.errt{color:var(--crit);font-size:12px;min-height:16px}
.upl{position:relative;overflow:hidden;display:inline-block}
.upl input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.badge{display:inline-block;background:var(--warn);color:#fff;padding:0 6px;margin-left:4px;line-height:18px;font-size:12px}
.badge[hidden]{display:none}
.vers{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.pb{display:flex;gap:2px;height:10px;width:110px}
.pb i{flex:1;background:var(--seg-off)}
.pb i.on{background:var(--accent)}
.pb.bad i.on{background:var(--crit)}
.ulist{margin:0;padding-left:18px;font-size:12px;display:flex;flex-direction:column;gap:3px}
.ugrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.mxg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.mxg{grid-template-columns:1fr}}
.mxw{position:relative}
.box canvas.mx{width:100%;height:170px;image-rendering:pixelated;display:block}
.mxtip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 8px;font-size:12px;white-space:nowrap;z-index:3;box-shadow:3px 3px 0 var(--shade)}
.mxtip[hidden]{display:none}
.stl{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.stl b{color:var(--ink);font-weight:500}
.tbl tr.cur td{background:var(--bg)}
input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}
/* list view: two compact lines per server, numbers only */
body.view-list .grid{grid-template-columns:1fr;gap:8px}
body.view-list .card{display:grid;grid-template-columns:250px auto minmax(0,1fr) auto;grid-template-areas:"head foot . metrics" "sub sub tags net";column-gap:16px;row-gap:3px;align-items:center;padding:9px 14px 9px 18px;box-shadow:3px 3px 0 var(--shade)}
body.view-list .card::before{left:-2px;top:-2px;bottom:-2px;right:auto;width:6px;height:auto}
body.view-list .c-head{grid-area:head}
body.view-list .c-title h3{font-size:19px}
body.view-list .c-sub{grid-area:sub;margin:0;white-space:nowrap}
body.view-list .c-foot{grid-area:foot;border:0;margin:0;padding:0;justify-content:flex-start}
body.view-list .c-foot .up{display:none}
body.view-list .tags{grid-area:tags;min-height:0;flex-wrap:nowrap;overflow:hidden}
body.view-list .tag{line-height:16px;font-size:11px}
body.view-list .metrics{grid-area:metrics;flex-direction:row;gap:18px;justify-content:flex-end}
body.view-list .m{display:flex;align-items:baseline;gap:6px}
body.view-list .bar{display:none}
body.view-list .mv{min-width:36px;font-size:14px}
body.view-list .bar[data-level="warn"]+.mv{color:var(--warn)}
body.view-list .bar[data-level="crit"]+.mv{color:var(--crit)}
body.view-list .spark-wrap{grid-area:net;border:0;padding:0;justify-self:end}
body.view-list .spark-wrap canvas{display:none}
body.view-list .net{flex-direction:row;gap:16px;justify-content:flex-end}
body.view-list .net span:last-child{display:none}
@media (max-width:999px){
  body.view-list .card{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"head foot" "sub sub" "metrics metrics" "tags net"}
  body.view-list .metrics{justify-content:flex-start}
  body.view-list .tags{flex-wrap:wrap}
}
@media (max-width:900px){.ugrid{grid-template-columns:1fr}}
@media (max-width:900px){.sum{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:400px){.grid{grid-template-columns:1fr}.search{min-width:0;width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true">
        <rect x="0" y="0" width="8" height="2" fill="var(--ink)"/>
        <rect x="0" y="3" width="8" height="2" fill="var(--ink)"/>
        <rect x="0" y="6" width="8" height="2" fill="var(--ink)"/>
        <rect x="5" y="0" width="1" height="2" fill="var(--bg)"/>
        <rect x="6" y="3" width="1" height="2" fill="var(--accent)"/>
        <rect x="5" y="6" width="1" height="2" fill="var(--bg)"/>
      </svg>
      <div>
        <h1>Linager</h1>
        <small id="subtitle">Debian · серверы</small>
      </div>
    </div>
    <div class="top-r">
      <span class="live"><i></i><span id="clock">live</span></span>
      <button class="btn" id="updBtn">Обновления <span class="badge" id="updBadge" hidden>0</span></button>
      <button class="btn" id="editBtn" aria-pressed="false">Редактировать</button>
      <button class="btn primary" id="addBtn">+ Сервер</button>
    </div>
  </header>

  <section class="sum dv" aria-label="Сводка">
    <div class="tile" id="t-online"><span class="k">Online</span><span class="v">0</span><span class="s"></span></div>
    <div class="tile" id="t-attn"><span class="k">Внимание</span><span class="v">0</span><span class="s"></span></div>
    <div class="tile" id="t-upd"><span class="k">Обновления</span><span class="v">0</span><span class="s"></span></div>
    <div class="tile" id="t-cpu"><span class="k">CPU средн.</span><span class="v">0%</span><span class="s"></span></div>
  </section>

  <div class="bar-row dv">
    <div class="chips" role="group" aria-label="Фильтр">
      <button class="chip" data-f="all" aria-pressed="true">Все</button>
      <button class="chip" data-f="problem" aria-pressed="false">Проблемные</button>
      <button class="chip" data-f="off" aria-pressed="false">Offline</button>
    </div>
    <div class="top-r">
      <div class="chips" id="viewSw" role="group" aria-label="Вид"><button class="chip" data-view="cards" aria-pressed="true">Карточки</button><button class="chip" data-view="list" aria-pressed="false">Строки</button></div>
      <input class="search" id="q" type="search" placeholder="Поиск по имени или IP" aria-label="Поиск по имени или IP">
    </div>
  </div>

  <main class="dv">
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty">Нет серверов по этому фильтру.</div>
  </main>

  <section id="detail" aria-label="Сервер">
    <div id="dhead"></div>
    <div class="tabs" id="dtabs" role="tablist"></div>
    <div class="panel" id="panel" role="tabpanel"></div>
  </section>

  <section id="updates" aria-label="Обновления Linager"><div id="updbody"></div></section>
</div>

<div class="modal" id="confirm" role="alertdialog" aria-modal="true" aria-labelledby="cTitle">
  <div class="sheet" style="max-width:440px">
    <div class="sheet-h"><h2 id="cTitle"></h2></div>
    <div class="sec">
      <p id="cText"></p>
      <div class="acts" style="justify-content:flex-end"><button class="btn sm" id="cNo">Отмена</button><button class="btn sm primary" id="cOk">OK</button></div>
    </div>
  </div>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
  <div class="sheet">
    <div class="sheet-h"><h2 id="mt">Добавить сервер</h2><button class="ib" id="mClose" aria-label="Закрыть">×</button></div>
    <div class="sec">
      <h4>Подключённые, не на дашборде</h4>
      <div id="avail" style="display:flex;flex-direction:column;gap:8px"></div>
    </div>
    <div class="sec">
      <h4>Ждут подтверждения</h4>
      <div id="pending" style="display:flex;flex-direction:column;gap:10px"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status"><span id="toastMsg"></span><button id="toastAct" hidden>Отменить</button></div>

<script>
(function(){
  var HIST=32;
  function mk(o){
    var s=Object.assign({online:1,os:'Debian 12',cpu:20,ram:40,disk:40,upd:0,reboot:0,failed:0,up:'10д 4ч',vol:6,rx:200,tx:80,last:''},o);
    s.base={cpu:s.cpu,ram:s.ram,rx:s.rx,tx:s.tx};
    s.hist=[];
    s.av='0.3.2';s.us={st:'idle',step:0,msg:''};
    s.rhist=[];s.nhist=[];
    for(var i=0;i<HIST;i++){
      s.hist.push(s.online?clamp(s.cpu+(Math.random()-.5)*s.vol*2,2,99):0);
      s.rhist.push(s.online?clamp(s.ram+(Math.random()-.5)*3,2,99):0);
      s.nhist.push(s.online?s.rx*(0.6+Math.random()*0.8):0);
    }
    return s;
  }
  function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

  var lib=[
    mk({id:'web-01',ip:'10.0.1.11',cpu:34,ram:52,disk:41,upd:3,up:'41д 6ч',rx:1400,tx:620}),
    mk({id:'web-02',ip:'10.0.1.12',cpu:28,ram:48,disk:44,upd:12,reboot:1,up:'112д 2ч',rx:980,tx:410}),
    mk({id:'db-primary',ip:'10.0.2.10',cpu:46,ram:78,disk:63,up:'67д 19ч',vol:10,rx:520,tx:1900}),
    mk({id:'db-replica',ip:'10.0.2.11',cpu:22,ram:71,disk:63,upd:5,failed:1,up:'67д 19ч',rx:1700,tx:90}),
    mk({id:'cache-01',ip:'10.0.3.5',cpu:12,ram:64,disk:18,upd:2,up:'203д 11ч',rx:300,tx:260}),
    mk({id:'mail-01',ip:'10.0.4.2',online:0,upd:7,up:'—',last:'12 мин'}),
    mk({id:'build-runner',ip:'10.0.5.20',cpu:94,ram:86,disk:72,upd:8,up:'9д 1ч',vol:4,rx:3200,tx:700}),
    mk({id:'backup-nas',ip:'10.0.6.3',os:'Debian 11',cpu:6,ram:31,disk:91,upd:1,up:'330д 7ч',rx:90,tx:2400}),
    mk({id:'monitor-01',ip:'10.0.1.30',cpu:18,ram:44,disk:35,up:'58д 3ч',rx:240,tx:120}),
    mk({id:'vpn-gw',ip:'10.0.0.1',cpu:9,ram:22,disk:27,upd:4,up:'144д 15ч',rx:2100,tx:2000}),
    mk({id:'staging-01',ip:'10.0.9.8',cpu:41,ram:58,disk:49,upd:6,up:'4д 20ч',rx:400,tx:150})
  ];
  var byId={};lib.forEach(function(s){byId[s.id]=s});
  byId['web-02'].av='0.3.1';byId['backup-nas'].av='0.2.9';byId['vpn-gw'].failOnce=true;
  var onBoard=lib.slice(0,8).map(function(s){return s.id});

  var pendingList=[
    {host:'edge-09',ip:'10.0.7.9',fp:'SHA256:Qm4x…r9Lw',hint:'7KQ2-9DXM'},
    {host:'dns-02',ip:'10.0.1.53',fp:'SHA256:Zt1p…c4Va',hint:'H3NB-41TE'}
  ];

  var grid=document.getElementById('grid'),emptyEl=document.getElementById('empty');
  var cards={};
  var editing=false,filter='all',query='';

  function level(s){
    if(!s.online)return 'off';
    if(s.cpu>90||s.ram>92||s.disk>90)return 'crit';
    if(s.cpu>75||s.ram>85||s.disk>80||s.failed>0||s.reboot||s.upd>=10)return 'warn';
    return 'ok';
  }
  function lv(v){return v>90?'crit':v>75?'warn':'ok'}
  function fmt(kb){return kb>=1024?(kb/1024).toFixed(1)+' MB/s':Math.round(kb)+' KB/s'}

  function buildCard(s){
    var el=document.createElement('article');
    el.className='card';el.dataset.id=s.id;
    var seg=new Array(21).join('<i></i>');
    function row(k,l){return '<div class="m"><span class="ml">'+l+'</span><div class="bar" data-bar="'+k+'">'+seg+'</div><span class="mv" data-f="'+k+'">0%</span></div>'}
    el.innerHTML=
      '<header class="c-head"><div class="c-title"><span class="dot"></span><h3>'+s.id+'</h3></div>'+
      '<div class="c-edit"><button class="ib" data-act="left" aria-label="Сдвинуть влево">‹</button><button class="ib" data-act="right" aria-label="Сдвинуть вправо">›</button><button class="ib del" data-act="remove" aria-label="Убрать с дашборда">×</button></div></header>'+
      '<p class="c-sub" data-f="sub">'+s.ip+' · '+s.os+' · агент '+s.av+'</p>'+
      '<div class="tags" data-f="tags"></div>'+
      '<div class="metrics">'+row('cpu','CPU')+row('ram','RAM')+row('disk','ДИСК')+'</div>'+
      '<div class="spark-wrap"><canvas width="160" height="26"></canvas><div class="net"><span>↓ <b data-f="rx"></b></span><span>↑ <b data-f="tx"></b></span><span data-f="ct">CPU 1 мин</span></div></div>'+
      '<footer class="c-foot"><span class="up" data-f="up"></span><div class="acts"><button class="btn sm" data-act="term">Терминал</button><button class="btn sm" data-act="open">Открыть</button></div></footer>';
    el.draggable=editing;
    cards[s.id]=el;
    return el;
  }

  function setBar(el,key,val,level){
    var b=el.querySelector('[data-bar="'+key+'"]');
    var n=Math.round(val/5),segs=b.children;
    for(var i=0;i<segs.length;i++){segs[i].className=i<n?'on':''}
    b.dataset.level=level;
  }

  function drawSpark(el,s){
    var c=el.querySelector('canvas'),g=c.getContext('2d');
    var cs=getComputedStyle(document.documentElement);
    var col=cs.getPropertyValue('--accent').trim(),hi=cs.getPropertyValue('--ink').trim(),off=cs.getPropertyValue('--seg-off').trim();
    g.clearRect(0,0,c.width,c.height);
    var w=4,gap=1,h=c.height;
    for(var i=0;i<HIST;i++){
      var v=s.hist[i];
      g.fillStyle=off;g.fillRect(i*(w+gap),h-1,w,1);
      if(!s.online)continue;
      var bh=Math.max(1,Math.round(v/100*h));
      g.fillStyle=(i===HIST-1)?hi:col;
      g.fillRect(i*(w+gap),h-bh,w,bh);
    }
  }

  function tagsHtml(s){
    var t=[];
    if(!s.online)t.push('<span class="tag off">нет связи</span>');
    if(s.failed)t.push('<span class="tag crit">служб упало: '+s.failed+'</span>');
    if(s.reboot)t.push('<span class="tag warn">нужна перезагрузка</span>');
    if(s.upd)t.push('<span class="tag '+(s.upd>=10?'warn':'')+'">обновлений: '+s.upd+'</span>');
    var as=agentState(s);
    if(as==='old')t.push('<span class="tag warn">агент устарел</span>');
    else if(as==='avail')t.push('<span class="tag">агент: есть обновление</span>');
    if(!t.length)t.push('<span class="tag ok">без замечаний</span>');
    return t.join('');
  }

  function updateCard(s){
    var el=cards[s.id];if(!el)return;
    var L=level(s);el.dataset.level=L;
    function f(k){return el.querySelector('[data-f="'+k+'"]')}
    var on=!!s.online;
    f('sub').textContent=s.ip+' · '+s.os+' · агент '+s.av;
    ['cpu','ram','disk'].forEach(function(k){
      var v=on?s[k]:0;
      setBar(el,k,v,lv(s[k]));
      f(k).textContent=on?Math.round(s[k])+'%':'—';
    });
    f('rx').textContent=on?fmt(s.rx):'—';
    f('tx').textContent=on?fmt(s.tx):'—';
    f('up').textContent=on?'uptime '+s.up:'офлайн '+s.last;
    var th=tagsHtml(s),tg=f('tags');
    if(tg.dataset.k!==th){tg.innerHTML=th;tg.dataset.k=th}
    drawSpark(el,s);
  }

  function summary(){
    var list=onBoard.map(function(id){return byId[id]});
    var on=list.filter(function(s){return s.online});
    var attn=list.filter(function(s){var l=level(s);return l!=='ok'});
    var crit=list.filter(function(s){return level(s)==='crit'}).length;
    var off=list.length-on.length;
    var upd=list.reduce(function(a,s){return a+(s.upd||0)},0);
    var rb=list.filter(function(s){return s.reboot}).length;
    var avg=on.length?on.reduce(function(a,s){return a+s.cpu},0)/on.length:0;
    function set(id,v,sub,alert){
      var t=document.getElementById(id);
      t.querySelector('.v').textContent=v;t.querySelector('.s').textContent=sub;
      t.classList.toggle('alert',!!alert);
    }
    set('t-online',on.length+'/'+list.length,off?'нет связи: '+off:'все на связи',off>0);
    set('t-attn',attn.length,crit?'критичных: '+crit:(attn.length?'предупреждения':'всё спокойно'),crit>0);
    set('t-upd',upd,rb?'ждут перезагрузки: '+rb:'перезагрузка не нужна',false);
    set('t-cpu',Math.round(avg)+'%','по серверам online',false);
    document.getElementById('subtitle').textContent='Debian · '+list.length+' '+plural(list.length,'сервер','сервера','серверов');
  }
  function plural(n,a,b,c){var m=n%10,k=n%100;return (m===1&&k!==11)?a:(m>=2&&m<=4&&(k<10||k>=20))?b:c}

  function applyFilter(){
    var vis=0;
    onBoard.forEach(function(id){
      var s=byId[id],el=cards[id];
      var L=level(s),ok=true;
      if(filter==='problem')ok=L==='warn'||L==='crit'||L==='off';
      if(filter==='off')ok=L==='off';
      if(query){var q=query.toLowerCase();ok=ok&&(s.id.toLowerCase().indexOf(q)>-1||s.ip.indexOf(q)>-1)}
      el.hidden=!ok;if(ok)vis++;
    });
    emptyEl.classList.toggle('show',vis===0);
    emptyEl.textContent=onBoard.length?'Нет серверов по этому фильтру.':'Дашборд пуст. Добавьте сервер кнопкой «+ Сервер».';
  }

  function refreshAll(){
    onBoard.forEach(function(id){updateCard(byId[id])});
    summary();applyFilter();
  }

  function addToBoard(id){
    var s=byId[id];
    if(!cards[id])buildCard(s);
    cards[id].draggable=editing;
    grid.appendChild(cards[id]);
    if(onBoard.indexOf(id)<0)onBoard.push(id);
    refreshAll();
  }

  function syncOrder(){
    onBoard=[].slice.call(grid.querySelectorAll('.card')).map(function(c){return c.dataset.id});
  }

  /* toast */
  var toastTimer,toast=document.getElementById('toast'),toastMsg=document.getElementById('toastMsg'),toastAct=document.getElementById('toastAct'),undoFn=null;
  function showToast(msg,undo){
    toastMsg.textContent=msg;undoFn=undo||null;toastAct.hidden=!undo;
    toast.classList.add('show');clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){toast.classList.remove('show')},5000);
  }
  toastAct.addEventListener('click',function(){if(undoFn)undoFn();undoFn=null;toast.classList.remove('show')});

  /* card actions */
  grid.addEventListener('click',function(e){
    var b=e.target.closest('button[data-act]');if(!b)return;
    var card=b.closest('.card'),id=card.dataset.id,act=b.dataset.act;
    if(act==='left'){var p=card.previousElementSibling;if(p){p.before(card);syncOrder()}}
    else if(act==='right'){var n=card.nextElementSibling;if(n){n.after(card);syncOrder()}}
    else if(act==='remove'){
      var idx=onBoard.indexOf(id);
      card.remove();syncOrder();refreshAll();
      showToast(id+' убран с дашборда',function(){
        grid.insertBefore(card,grid.children[idx]||null);syncOrder();refreshAll();
      });
    }
    else if(act==='term')openDetail(id,'terminal');
    else if(act==='open')openDetail(id,'overview');
  });
  grid.addEventListener('click',function(e){
    var h=e.target.closest('h3');
    if(h&&!editing)openDetail(h.closest('.card').dataset.id,'overview');
  });

  /* drag and drop */
  var dragEl=null;
  grid.addEventListener('dragstart',function(e){
    var c=e.target.closest('.card');if(!c||!editing)return;
    dragEl=c;c.classList.add('dragging');
    e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',c.dataset.id);
  });
  grid.addEventListener('dragover',function(e){
    if(!dragEl)return;e.preventDefault();
    var t=e.target.closest('.card');if(!t||t===dragEl||t.hidden)return;
    var follows=dragEl.compareDocumentPosition(t)&Node.DOCUMENT_POSITION_FOLLOWING;
    if(follows)t.after(dragEl);else t.before(dragEl);
  });
  grid.addEventListener('drop',function(e){if(dragEl)e.preventDefault()});
  grid.addEventListener('dragend',function(){
    if(dragEl)dragEl.classList.remove('dragging');
    dragEl=null;syncOrder();
  });

  /* view switch: cards or table rows */
  function setView(v){
    document.body.classList.toggle('view-list',v==='list');
    [].forEach.call(document.querySelectorAll('#viewSw .chip'),function(b){b.setAttribute('aria-pressed',b.dataset.view===v)});
    try{localStorage.setItem('lg-view',v)}catch(e){}
  }
  [].forEach.call(document.querySelectorAll('#viewSw .chip'),function(b){b.addEventListener('click',function(){setView(b.dataset.view)})});
  try{var sv=localStorage.getItem('lg-view');if(sv==='list')setView('list')}catch(e){}

  /* toolbar */
  var editBtn=document.getElementById('editBtn');
  editBtn.addEventListener('click',function(){
    editing=!editing;
    document.body.classList.toggle('editing',editing);
    editBtn.setAttribute('aria-pressed',editing);
    editBtn.textContent=editing?'Готово':'Редактировать';
    Object.keys(cards).forEach(function(id){cards[id].draggable=editing});
    if(editing)showToast('Перетаскивайте карточки или используйте ‹ ›');
  });
  [].forEach.call(document.querySelectorAll('.chip'),function(c){
    c.addEventListener('click',function(){
      filter=c.dataset.f;
      [].forEach.call(document.querySelectorAll('.chip'),function(x){x.setAttribute('aria-pressed',x===c)});
      applyFilter();
    });
  });
  document.getElementById('q').addEventListener('input',function(e){query=e.target.value.trim();applyFilter()});

  /* modal */
  var modal=document.getElementById('modal'),lastFocus=null;
  function renderModal(){
    var av=document.getElementById('avail');av.innerHTML='';
    var free=lib.filter(function(s){return onBoard.indexOf(s.id)<0});
    if(!free.length){av.innerHTML='<p class="none">Все подключённые серверы уже на дашборде.</p>'}
    free.forEach(function(s){
      var r=document.createElement('div');r.className='row';
      r.innerHTML='<div><div class="nm">'+s.id+'</div><div class="sm">'+s.os+' · '+s.ip+'</div></div><button class="btn sm" data-add="'+s.id+'">Добавить</button>';
      av.appendChild(r);
    });
    var pe=document.getElementById('pending');pe.innerHTML='';
    if(!pendingList.length){pe.innerHTML='<p class="none">Новых подключений нет. На сервере выполните <code>linager agent connect panel.example.com:8443</code>.</p>'}
    pendingList.forEach(function(p,i){
      var d=document.createElement('div');d.className='pend';
      d.innerHTML='<div><span class="nm" style="font-family:var(--font-display);font-size:16px;font-weight:600">'+p.host+'</span> <span class="sm" style="color:var(--muted)">'+p.ip+'</span></div>'+
        '<div class="sm" style="color:var(--muted);font-size:12px">Отпечаток '+p.fp+'</div>'+
        '<div class="line"><input id="key'+i+'" placeholder="XXXX-XXXX" maxlength="9" aria-label="Ключ подключения для '+p.host+'" autocomplete="off"><button class="btn sm" data-ok="'+i+'">Подтвердить</button></div>'+
        '<div class="err" id="err'+i+'"></div>'+
        '<div class="sm" style="color:var(--muted);font-size:12px">Для макета подойдёт любой ключ вида XXXX-XXXX, например '+p.hint+'.</div>';
      pe.appendChild(d);
    });
  }
  function openModal(){lastFocus=document.activeElement;renderModal();modal.classList.add('open');document.getElementById('mClose').focus()}
  function closeModal(){modal.classList.remove('open');if(lastFocus)lastFocus.focus()}
  document.getElementById('addBtn').addEventListener('click',openModal);
  document.getElementById('mClose').addEventListener('click',closeModal);
  modal.addEventListener('click',function(e){
    if(e.target===modal){closeModal();return}
    var a=e.target.closest('[data-add]');
    if(a){var id=a.dataset.add;addToBoard(id);renderModal();showToast(id+' добавлен на дашборд');return}
    var o=e.target.closest('[data-ok]');
    if(o){
      var i=+o.dataset.ok,p=pendingList[i],val=document.getElementById('key'+i).value.trim();
      if(!/^[A-Za-z0-9]{4}-[A-Za-z0-9]{4}$/.test(val)){
        document.getElementById('err'+i).textContent='Ключ не подошёл. Скопируйте его из вывода команды на сервере.';return;
      }
      var s=mk({id:p.host,ip:p.ip,cpu:15,ram:30,disk:22,up:'0д 0ч',rx:120,tx:60});
      lib.push(s);byId[s.id]=s;pendingList.splice(i,1);
      addToBoard(s.id);renderModal();showToast(s.id+' подключён и добавлен на дашборд');
    }
  });

  function fwRule(r,c){

      '<button class="btn sm" data-ux="runsel"'+(selN&&!running?'':' disabled')+'>Обновить выбранные ('+selN+')</button><button class="btn sm primary" data-ux="runall"'+(avail.length&&!running?'':' disabled')+'>Обновить все ('+avail.length+')</button></div>'+
      '<div class="tw"><table class="tbl"><thead><tr><th><input type="checkbox" data-ux="selall" aria-label="Выбрать все"'+(avail.length&&selN===avail.length?' checked':'')+(avail.length&&!running?'':' disabled')+'></th><th>Сервер</th><th>Версия</th><th>Статус</th><th>Ход</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
    var cache='<div class="box"><h4>Кэш релизов на сервере</h4><div class="tw"><table class="tbl"><thead><tr><th>Версия</th><th>Размер</th><th>Загружена</th><th>Подпись</th></tr></thead><tbody>'+
      (newer&&!U.cache.some(function(c){return c.v===U.latest})?'<tr><td>'+esc(U.latest)+'</td><td class="sm2">—</td><td class="sm2">не загружена</td><td><button class="btn sm" data-ux="cache"'+(U.caching?' disabled':'')+'>'+(U.caching?'Загрузка…':'Загрузить заранее')+'</button></td></tr>':'')+
      U.cache.map(function(c){return '<tr><td>'+esc(c.v)+'</td><td class="sm2">'+c.size+'</td><td class="sm2">'+c.date+'</td><td><span class="st active">проверена</span></td></tr>'}).join('')+'</tbody></table></div><p class="sm2" style="margin:0">Подпись проверяется встроенным в бинарник публичным ключом.</p></div>';
    var cli='<div class="box"><h4>То же из терминала</h4><div class="logs" style="height:auto"><pre>linager update --check      # проверить обновления сервера\nlinager update              # обновить сервер: бэкап БД, миграции, откат при сбое\nlinager agent update        # обновить агента на этом сервере\nlinager agent status        # версия агента и состояние связи</pre></div></div>';
    var hist='<div class="box"><h4>История обновлений</h4><div class="tw"><table class="tbl"><thead><tr><th>Время</th><th>Что</th><th>Версии</th><th>Результат</th></tr></thead><tbody>'+U.hist.slice(0,8).map(function(h){return '<tr><td class="sm2">'+h.t+'</td><td>'+esc(h.what)+'</td><td class="sm2">'+h.from+' → '+h.to+'</td><td><span class="st '+(h.res==='ok'?'active':'failed')+'">'+(h.res==='ok'?'успешно':'откат')+'</span></td></tr>'}).join('')+'</tbody></table></div></div>';
    var keep=document.activeElement&&document.activeElement.id;
    el.innerHTML='<div class="d-head"><div class="d-ttl"><button class="btn sm" data-ux="back">← Серверы</button><h2>Обновления Linager</h2></div><span class="sm2">канал: '+U.channel+'</span></div><div class="ugrid">'+srv+cache+'</div>'+ag+'<div class="ugrid">'+hist+cli+'</div>';
    if(keep){var f=$(keep);if(f)f.focus()}
  }
  function showUpdates(){
    document.body.classList.remove('in-detail');D.id=null;
    document.body.classList.add('in-updates');renderUpdates();window.scrollTo(0,0);
  }
  function hideUpdates(){document.body.classList.remove('in-updates');refreshAll();window.scrollTo(0,0)}
  $('updBtn').addEventListener('click',function(){try{location.hash='updates'}catch(e){}showUpdates()});
  $('updates').addEventListener('click',function(e){
    var b=e.target.closest('[data-ux]');if(!b)return;
    var a=b.dataset.ux;
    if(a==='back'){try{location.hash=''}catch(x){}hideUpdates()}
    else if(a==='check'){
      U.checking=true;renderUpdates();
      setTimeout(function(){U.checking=false;U.checked='только что';renderUpdates();showToast(U.cur!==U.latest?'Найдена версия '+U.latest:'Новых версий нет')},1100);
    }
    else if(a==='cache'){
      U.caching=true;renderUpdates();
      setTimeout(function(){U.caching=false;U.cache.unshift({v:U.latest,size:'19.1 МБ',date:'сегодня',src:'GitHub'});renderUpdates();showToast('Версия '+U.latest+' загружена в кэш')},1300);
    }
    else if(a==='srv')confirmBox('Обновить сервер до '+U.latest+'?','Перед обновлением создаётся резервная копия БД и применяются миграции. Админка на минуту станет недоступна. При сбое сервер откатится сам.','Обновить',serverUpdate);
    else if(a==='sel'){U.sel[b.dataset.id]=b.checked;renderUpdates()}
    else if(a==='selall'){lib.forEach(function(s){var x=agentState(s);if(x==='avail'||x==='old'||x==='rolled')U.sel[s.id]=b.checked});renderUpdates()}
    else if(a==='one')agentUpdate(byId[b.dataset.id]);
    else if(a==='runsel'||a==='runall'){
      var list=lib.filter(function(s){var x=agentState(s);return (x==='avail'||x==='old'||x==='rolled')&&(a==='runall'||U.sel[s.id])});
      confirmBox('Обновить агентов: '+list.length+'?','Агенты перезапустятся, связь с каждым прервётся на несколько секунд. Если агент не выйдет на связь за 60 секунд, он откатится на прежнюю версию.','Обновить',function(){U.sel={};rollout(list)});
    }
  });
  $('updates').addEventListener('change',function(e){
    if(e.target.id==='uch'){
      U.channel=e.target.value;U.latest=U.channel==='beta'?'0.5.0-beta.1':'0.4.0';U.checked='только что';renderUpdates();
    }else if(e.target.id==='ustr'){U.strategy=e.target.value}
    else if(e.target.id==='ustop'){U.stopOnErr=e.target.checked}
  });

  /* shell of the detail page */
  function updateHead(force){
    var s=cur();if(!s)return;
    var k=[s.online,s.reboot,level(s),s.id,s.av,agentState(s)].join('|');
    if(!force&&k===D.headKey)return;
    D.headKey=k;
    var L=level(s);
    detailEl.dataset.level=L;
    $('dhead').innerHTML=
      '<div class="d-head"><div class="d-ttl"><button class="btn sm" data-d="back">← Серверы</button><span class="dot"></span><h2>'+esc(s.id)+'</h2><span class="tag '+L+'">'+({ok:'в норме',warn:'предупреждение',crit:'критично',off:'офлайн'}[L])+'</span></div>'+
      '<div class="acts"><button class="btn sm" data-d="reboot"'+(s.online?'':' disabled')+'>Перезагрузить</button></div></div>'+
      '<p class="c-sub" style="margin-top:0">'+esc(s.os)+' · '+esc(s.ip)+' · linager-agent '+esc(s.av)+'</p>'+
      (s.online&&s.reboot?'<div class="banner"><span>Нужна перезагрузка: обновлено ядро или системная библиотека.</span><button class="btn sm" data-d="reboot">Перезагрузить сейчас</button></div>':'')+agBanner(s);
  }
  function renderTab(){
    var s=cur();if(!s)return;
    [].forEach.call(document.querySelectorAll('#dtabs .tab'),function(b){b.setAttribute('aria-selected',b.dataset.tab===D.tab)});
    var p=$('panel');
    if(!s.online&&D.tab!=='metrics'){p.innerHTML='<div class="offl"><div class="big">Нет связи с агентом</div><p>Последний контакт: '+esc(lastTxt(s))+'. Управление и метрики недоступны, пока агент не подключится снова.</p>'+(s.net&&s.net.rb?'<p>Применены сетевые настройки. Если связь не восстановится, они откатятся через <b id="nleft">'+s.net.left+'</b> с.</p>':'')+'</div>';return}
    if(D.tab==='overview')tabOverview(s);
    else if(D.tab==='terminal')tabTerminal(s);
    else if(D.tab==='services')tabServices(s);
    else if(D.tab==='updates')tabUpdates(s);
    else if(D.tab==='procs')tabProcs(s);
    else if(D.tab==='logs')tabLogs(s);
    else if(D.tab==='files')tabFiles(s);
    else if(D.tab==='docker')tabDocker(s);
    else if(D.tab==='firewall')tabFirewall(s);
    else if(D.tab==='network')tabNetwork(s);
    else if(D.tab==='metrics')tabMetrics(s);
  }
  function showDetail(id){
    if(D.id!==id){D.plog=null;D.busy=false;D.paused=false;D.logUnit='all';D.fpath=[];D.fopen=null;D.fnew=null;D.dkView='c';D.dkLog=null}
    D.id=id;
    document.body.classList.add('in-detail');document.body.classList.remove('in-updates');
    $('dtabs').innerHTML=TABS.map(function(t){return '<button class="tab" role="tab" data-tab="'+t[0]+'" aria-selected="false">'+t[1]+'</button>'}).join('');
    updateHead(true);renderTab();
    window.scrollTo(0,0);
  }
  function hideDetail(){
    document.body.classList.remove('in-detail');D.id=null;
    refreshAll();window.scrollTo(0,0);
  }
  function openDetail(id,tab){
    D.tab=tab||'overview';
    try{location.hash='srv-'+id}catch(e){}
    showDetail(id);
  }
  function route(){
    var m=/^#srv-(.+)$/.exec(location.hash);
    if(m&&byId[m[1]]){if(!inDetail()||D.id!==m[1])showDetail(m[1])}
    else if(location.hash==='#updates')showUpdates();
    else{if(inDetail())hideDetail();if(document.body.classList.contains('in-updates'))hideUpdates()}
  }
  window.addEventListener('hashchange',route);

  function doReboot(s){
    ensureTerm(s);
    tPrint(s,'Connection to '+s.id+' closed by remote host.','err');
    s.online=0;s.last='только что';
    showToast(s.id+' перезагружается…');
    refreshAll();
    if(D.id===s.id){updateHead(true);renderTab()}
    setTimeout(function(){
      s.online=1;s.reboot=0;s.up='0д 0ч';s.cpu=clamp(s.base.cpu+25,2,99);
      showToast(s.id+' снова online');
      refreshAll();
      if(D.id===s.id){updateHead(true);renderTab()}
    },7000);
  }

  detailEl.addEventListener('click',function(e){
    var s=cur();if(!s)return;
    var tb=e.target.closest('.tab');
    if(tb){D.tab=tb.dataset.tab;renderTab();return}
    var sv=e.target.closest('[data-svc]');
    if(sv){svcAction(s,sv.dataset.svc,sv.dataset.act);return}
    var kp=e.target.closest('[data-kill]');
    if(kp){
      var pid=+kp.dataset.kill,pr=s.procs.filter(function(p){return p.pid===pid})[0];
      s.procs=s.procs.filter(function(p){return p.pid!==pid});
      renderProcs(s);showToast('SIGTERM → '+pid+' ('+(pr?pr.cmd:'')+')');return;
    }
    var so=e.target.closest('[data-sort]');
    if(so){D.procSort=so.dataset.sort;tabProcs(s);return}
    var b=e.target.closest('[data-d]');if(!b)return;
    var d=b.dataset.d;
    if(d==='back'){try{location.hash=''}catch(x){}hideDetail()}
    else if(d==='reboot')confirmBox('Перезагрузить '+s.id+'?','Все сеансы и службы на сервере остановятся. Сервер вернётся в панель после загрузки.','Перезагрузить',function(){doReboot(s)});
    else if(d==='agupd')agentUpdate(s);
    else if(d==='pcheck')runCheck(s);
    else if(d==='pall')runUpgrade(s,false);
    else if(d==='psec')runUpgrade(s,true);
    else if(d==='tclear'){s.term.lines=[];tRender(s);$('tcmd').focus()}
    else if(d==='lpause'){D.paused=!D.paused;b.setAttribute('aria-pressed',D.paused);b.textContent=D.paused?'Продолжить':'Пауза';if(!D.paused)renderLogs(s)}
  });
  detailEl.addEventListener('input',function(e){
    if(e.target.id==='svcq'){
      var q=e.target.value.trim().toLowerCase();
      [].forEach.call(detailEl.querySelectorAll('tbody tr[data-n]'),function(r){r.hidden=q&&r.dataset.n.toLowerCase().indexOf(q)<0});
    }
  });
  detailEl.addEventListener('change',function(e){
    if(e.target.id==='lu'){D.logUnit=e.target.value;renderLogs(cur())}
  });
  function detailTick(){
    var s=cur();if(!s||!inDetail())return;
    updateHead();
    if(!s.online)return;
    if(D.tab==='overview')updateOverview(s);
    else if(D.tab==='procs')renderProcs(s);
    else if(D.tab==='logs'){addLogs(s);if(!D.paused)renderLogs(s)}
    else if(D.tab==='docker')dkTick(s);
    else if(D.tab==='firewall')fwTick(s);
    else if(D.tab==='network')netTick(s);
  }

  /* live simulation */
  function tick(){
    lib.forEach(function(s){
      if(!s.online)return;
      s.cpu=clamp(s.cpu+(s.base.cpu-s.cpu)*.15+(Math.random()-.5)*s.vol,2,99);
      s.ram=clamp(s.ram+(s.base.ram-s.ram)*.1+(Math.random()-.5)*1.2,5,97);
      s.rx=Math.max(5,s.base.rx*(0.6+Math.random()*0.8));
      s.tx=Math.max(5,s.base.tx*(0.6+Math.random()*0.8));
      s.hist.push(s.cpu);if(s.hist.length>HIST)s.hist.shift();
      s.rhist.push(s.ram);if(s.rhist.length>HIST)s.rhist.shift();
      s.nhist.push(s.rx);if(s.nhist.length>HIST)s.nhist.shift();
    });
    refreshAll();
    detailTick();
    var d=new Date();
    document.getElementById('clock').textContent='live · '+d.toLocaleTimeString('ru-RU');
  }

  onBoard.slice().forEach(function(id){grid.appendChild(buildCard(byId[id]))});
  refreshAll();
  tick();
  route();
  updBadge();
  setInterval(tick,2000);
})();
</script>
</body>
</html>
