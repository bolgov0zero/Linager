<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Linager: макет мобильной версии</title>
<style>
@font-face{font-family:"Medeo Mono";src:url(../mockup/fonts/MedeoMonoVariable.woff2) format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:"Medeo Pixel";src:url(../mockup/fonts/MedeoPixelVariable.woff) format("woff");font-style:normal;font-display:swap}
:root{
  --bg:#e8ebe5;--surface:#f6f7f3;--ink:#14181e;--muted:#5d6572;--line:#14181e;--accent:#2b55d9;--good:#1e8a4b;--warn:#b36f0e;--crit:#c4352a;--seg-off:#d5d9d0;--shade:#c3c8bd;
  --series-1:#2b55d9;--series-2:#a3369a;--c1:#2b55d9;--c2:#a3369a;--c3:#b36f0e;--c4:#1e8a4b;--c5:#1f8aa0;--c6:#6b7488;
  --tap:44px;--g:12px;
  --font-display:"Medeo Pixel","Medeo Mono",ui-monospace,Menlo,Consolas,monospace;
  --font-body:"Medeo Mono",ui-monospace,Menlo,Consolas,monospace;
  font-variation-settings:"ELSH" 1;font-synthesis:none;color-scheme:light;
}
:root[data-theme="dark"]{--bg:#0f1218;--surface:#171b23;--ink:#e6e9ef;--muted:#8a93a4;--line:#3b4455;--accent:#7d9cff;--good:#4fcf86;--warn:#e6b04b;--crit:#ff6d60;--seg-off:#272d39;--shade:#0a0c10;--series-1:#5b84f0;--series-2:#c95fc0;--c1:#7d9cff;--c2:#c95fc0;--c3:#e6b04b;--c4:#4fcf86;--c5:#4fc3d9;--c6:#9aa3b5;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:#d6d9d2;color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.45}
:root[data-theme="dark"] body{background:#07090c}
h1,h2,h3,h4,p{margin:0;font-weight:400}
button,input{font:inherit;color:inherit;border-radius:0}
.muted{color:var(--muted)}.small{font-size:12px}.ok{color:var(--good)}.warn{color:var(--warn)}.crit{color:var(--crit)}.acc{color:var(--accent)}
.ic{width:20px;height:20px;flex:none;display:block}.ic.s{width:16px;height:16px}

/* ───── viewer (desktop only) ───── */
.viewer{display:grid;grid-template-columns:250px 430px 300px;gap:44px;justify-content:center;align-items:start;padding:28px 20px 40px}
.index{position:sticky;top:20px;max-height:calc(100vh - 40px);overflow:auto;font-size:13px}
.index h2{font-family:var(--font-display);font-size:22px;margin-bottom:4px}
.index h4{font-family:var(--font-display);font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:14px 0 4px}
.index a{display:block;padding:3px 8px;color:var(--ink);text-decoration:none;cursor:pointer;border-left:2px solid transparent}
.index a:hover{background:var(--seg-off)}.index a.on{border-left-color:var(--accent);background:var(--surface);font-weight:600}
.viewer-btns{display:flex;gap:6px;margin:10px 0}
.viewer-btns button{background:var(--surface);border:2px solid var(--line);padding:4px 10px;cursor:pointer;font-family:var(--font-display)}
.notes{position:sticky;top:20px;background:var(--surface);border:2px solid var(--line);box-shadow:4px 4px 0 var(--shade);padding:14px;font-size:13px}
.notes h3{font-family:var(--font-display);font-size:18px;margin-bottom:8px}
.notes ul{margin:0;padding-left:18px}.notes li{margin:5px 0}
.notes .g{font-family:var(--font-display);color:var(--muted);text-transform:uppercase;font-size:12px;letter-spacing:.08em;margin:12px 0 2px}

/* ───── phone ───── */
.phone{position:relative;width:430px;height:932px;background:var(--bg);border-radius:52px;box-shadow:0 0 0 12px #0b0d11,0 0 0 14px #3a404c,0 24px 60px rgba(0,0,0,.35);overflow:hidden;display:flex;flex-direction:column;--safe-top:54px;--safe-bot:30px;isolation:isolate}
.sb{flex:none;height:var(--safe-top);display:flex;justify-content:space-between;align-items:flex-end;padding:0 34px 9px;font-weight:600;font-size:15px;background:var(--surface);color:var(--ink)}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:126px;height:37px;border-radius:20px;background:#000;z-index:80}
.hind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:140px;height:5px;border-radius:3px;background:var(--ink);z-index:80;pointer-events:none}
.view{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}

.top{flex:none;display:flex;align-items:center;gap:8px;min-height:54px;padding:5px var(--g);background:var(--surface);border-bottom:2px solid var(--line);z-index:5}
.top .ttl{flex:1;min-width:0}
.top .ttl h1{font-family:var(--font-display);font-size:22px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl p{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .brand{display:flex;align-items:center;gap:8px}
.logo{width:30px;height:30px}
.ibtn{width:var(--tap);height:var(--tap);flex:none;display:inline-flex;align-items:center;justify-content:center;background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:2px 2px 0 var(--shade);cursor:pointer;padding:0;position:relative}
.ibtn:active,.btn:active{transform:translate(2px,2px);box-shadow:none}
.ibtn.flat{border-color:transparent;box-shadow:none;background:none}
.ibtn.pri{background:var(--accent);color:var(--surface)}
.ibtn .dotb{position:absolute;top:3px;right:3px;width:9px;height:9px;background:var(--warn)}

.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:var(--g) var(--g) 20px;scrollbar-width:none;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{display:none}
.scroll.flush{padding:0;display:flex;flex-direction:column}.scroll.flush>.term{flex:1;border:0;border-bottom:2px solid var(--line);padding:12px;font-size:11.5px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:8px}.row.wrap{flex-wrap:wrap}.row.sp{justify-content:space-between}
.grow{flex:1;min-width:0}

.tabbar{flex:none;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px 6px calc(var(--safe-bot) - 4px);background:var(--surface);border-top:2px solid var(--line);z-index:5}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:54px;background:none;border:2px solid transparent;color:var(--muted);cursor:pointer;font-family:var(--font-display);font-size:12px;padding:0;position:relative}
.tab[aria-current=true]{background:var(--ink);color:var(--surface)}
.tab .cnt{position:absolute;top:2px;right:calc(50% - 22px);min-width:16px;height:16px;padding:0 3px;background:var(--warn);color:#fff;font-size:11px;line-height:16px;text-align:center}
.tab .cnt.crit{background:var(--crit)}

.dock{flex:none;display:flex;flex-direction:column;gap:8px;padding:10px var(--g);background:var(--surface);border-top:2px solid var(--line);z-index:4}
.dock.pad{padding-bottom:calc(var(--safe-bot) + 4px)}
.dock .t{font-size:12.5px}
.dock.warn{border-top-color:var(--warn)}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:var(--tap);padding:0 14px;background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:3px 3px 0 var(--shade);cursor:pointer;font-family:var(--font-display);font-size:15px;letter-spacing:.02em;white-space:nowrap}
.btn.sm{height:36px;padding:0 10px;font-size:14px}
.btn.pri{background:var(--accent);color:var(--surface)}.btn.dng{background:var(--crit);color:var(--surface);border-color:var(--crit)}.btn.ink{background:var(--ink);color:var(--surface)}
.btn.blk{width:100%}.btn.f1{flex:1}
.btn[disabled]{opacity:.5;box-shadow:none}
.seg{display:flex;border:2px solid var(--line);background:var(--surface);box-shadow:3px 3px 0 var(--shade)}
.seg button{flex:1;min-width:0;height:40px;background:none;border:0;border-left:2px solid var(--line);font-family:var(--font-display);font-size:14px;cursor:pointer;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button:first-child{border-left:0}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--surface)}
.seg.sm button{height:34px;font-size:13px}
.input{width:100%;height:var(--tap);padding:0 12px;background:var(--surface);color:var(--ink);border:2px solid var(--line);font:inherit;font-size:16px}
.input::placeholder{color:var(--muted)}
.sel{display:flex;align-items:center;justify-content:space-between;gap:8px;height:var(--tap);padding:0 12px;background:var(--surface);border:2px solid var(--line);box-shadow:3px 3px 0 var(--shade);font-size:14px;cursor:pointer;width:100%;text-align:left}
.field{display:flex;flex-direction:column;gap:5px}.field>label{color:var(--muted);font-size:12px}
.chk{display:flex;align-items:center;gap:10px;min-height:var(--tap);cursor:pointer}
.chk i{width:22px;height:22px;border:2px solid var(--line);background:var(--surface);box-shadow:2px 2px 0 var(--shade);flex:none;display:grid;place-content:center}
.chk i.on{background:var(--ink)}.chk i.on::after{content:"";width:10px;height:10px;background:var(--surface);clip-path:polygon(0 55%,20% 40%,40% 62%,85% 0,100% 15%,40% 100%)}

/* blocks */
.card{background:var(--surface);border:2px solid var(--line);box-shadow:3px 3px 0 var(--shade);padding:12px}
.card.flush{padding:0}
.card.edge{border-left-width:5px}.card.edge.warn{border-left-color:var(--warn)}.card.edge.crit{border-left-color:var(--crit)}.card.edge.off{border-left-color:var(--muted)}.card.edge.ok{border-left-color:var(--good)}
h3.t{font-family:var(--font-display);font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.sech{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 2px 0}
.big{font-family:var(--font-display);font-size:28px;line-height:1.1}
.tag{display:inline-flex;align-items:center;padding:0 6px;height:20px;border:2px solid currentColor;font-size:11.5px;white-space:nowrap;line-height:1}
.tag.fill{background:currentColor}.tag.fill>*{color:var(--surface)}
.dot{display:inline-block;width:9px;height:9px;background:currentColor;flex:none}
.sum{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:2px solid var(--line);box-shadow:3px 3px 0 var(--shade)}
.sum>div{padding:8px 8px 7px;border-left:2px solid var(--line);position:relative;min-width:0}
.sum>div:first-child{border-left:0}
.sum small{display:block;font-family:var(--font-display);font-size:10.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.sum b{font-family:var(--font-display);font-weight:400;font-size:24px;line-height:1.15}
.sum span{display:block;font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum .mk{position:absolute;top:0;right:0;width:7px;height:7px;background:var(--crit)}
.stick{position:sticky;top:calc(var(--g) * -1);z-index:3;margin:0 calc(var(--g) * -1);padding:8px var(--g);background:var(--bg);border-bottom:2px solid transparent}
.live{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.live i{width:8px;height:8px;background:var(--good)}

/* segmented meters */
.segs{display:flex;gap:2px;height:8px}.segs i{flex:1;background:var(--seg-off)}.segs i.on{background:var(--accent)}.segs.warn i.on{background:var(--warn)}.segs.crit i.on{background:var(--crit)}
.segs.t{height:12px}
.met{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.met>div{min-width:0}.met small{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}.met b{font-weight:400;color:var(--ink)}
.met .segs{margin-top:4px}

/* server card */
.srv{display:block;padding:10px 12px;text-align:left;width:100%;cursor:pointer}
.srv .nm{font-family:var(--font-display);font-size:21px;line-height:1.2;display:flex;align-items:center;gap:8px}
.srv .meta{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:1px 0 8px}
.srv .ft{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:9px;font-size:11.5px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{padding:9px 10px;text-align:left;cursor:pointer;min-width:0}
.tile .nm{font-family:var(--font-display);font-size:18px;display:flex;gap:6px;align-items:center}
.tile .ip{font-size:11px;color:var(--muted);margin-bottom:6px}
.tile .m{display:grid;grid-template-columns:34px 1fr 34px;align-items:center;gap:5px;font-size:11px;margin-top:3px}
.tile .m b{font-weight:400;text-align:right}

/* list rows */
.list{background:var(--surface);border:2px solid var(--line);box-shadow:3px 3px 0 var(--shade)}
.li{display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 8px 8px 12px;border-top:2px dashed var(--seg-off);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer}
.li:first-child{border-top:0}
.li .mn{flex:1;min-width:0}
.li .l1{display:flex;align-items:center;gap:8px;white-space:nowrap}
.li .l1 b{font-weight:400;overflow:hidden;text-overflow:ellipsis;font-size:14.5px}
.li .l2{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .r{flex:none;text-align:right;font-size:12px}
.li.bad{box-shadow:inset 4px 0 0 var(--crit)}.li.wn{box-shadow:inset 4px 0 0 var(--warn)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:2px dashed var(--seg-off);font-size:13px}
.kv:first-child{border-top:0}.kv span:first-child{color:var(--muted);flex:none}.kv span:last-child{text-align:right;overflow-wrap:anywhere}
.warnbox{display:flex;gap:10px;align-items:center;padding:8px 10px;border:2px solid var(--warn);color:var(--warn);font-size:13px;background:var(--surface);cursor:pointer;width:100%;text-align:left}
.warnbox.crit{border-color:var(--crit);color:var(--crit)}.warnbox span{flex:1;min-width:0}
.chart{display:block;width:100%;height:auto}
.term{background:#0b0e13;color:#d8dde6;font-size:12px;line-height:1.5;padding:10px;white-space:pre-wrap;overflow-wrap:anywhere;border:2px solid var(--accent)}
.term .p{color:#7d9cff}

/* sheets */
.ov{position:absolute;inset:0;z-index:50;display:none;background:rgba(10,12,16,.5);align-items:flex-end}
.ov.on{display:flex}
.sheet{width:100%;max-height:88%;display:flex;flex-direction:column;background:var(--surface);border-top:2px solid var(--line);box-shadow:0 -4px 0 var(--shade)}
.sheet.full{height:calc(100% - 20px);max-height:none}
.sheet .sh{flex:none;display:flex;align-items:center;gap:10px;padding:6px 6px 6px 14px;min-height:52px;border-bottom:2px solid var(--line)}
.sheet .sh h2{flex:1;font-family:var(--font-display);font-size:20px;min-width:0}
.sheet .sb2{flex:1;min-height:0;overflow-y:auto;padding:12px var(--g)}
.sheet .sf{flex:none;display:flex;gap:8px;padding:10px var(--g) calc(var(--safe-bot) + 2px);border-top:2px solid var(--line)}
.act{display:flex;align-items:center;gap:12px;width:100%;height:50px;padding:0 14px;background:none;border:0;border-top:2px dashed var(--seg-off);text-align:left;cursor:pointer;font-size:15px}
.act:first-child{border-top:0}.act.dng{color:var(--crit)}.act small{margin-left:auto;color:var(--muted);font-size:12px}
.grp{font-family:var(--font-display);font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:10px 14px 2px}
.navgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 var(--g) 6px}
.navit{display:flex;align-items:center;gap:10px;height:50px;padding:0 10px;border:2px solid var(--line);background:var(--surface);box-shadow:2px 2px 0 var(--shade);cursor:pointer;font-family:var(--font-display);font-size:15px;position:relative;text-align:left}
.navit[aria-current=true]{background:var(--ink);color:var(--surface)}
.navit .cnt{margin-left:auto;min-width:18px;height:18px;padding:0 4px;background:var(--warn);color:#fff;font-size:11px;line-height:18px;text-align:center}
.kbd{flex:none;height:300px;background:#cfd3da;border-top:1px solid #a9adb5;display:grid;place-content:center;color:#6b7078;font-size:13px}
:root[data-theme="dark"] .kbd{background:#2a2d33;border-color:#16181c}
.keys{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;padding:6px;background:var(--surface);border-top:2px solid var(--line)}
.keys button{height:40px;background:var(--surface);border:2px solid var(--line);box-shadow:2px 2px 0 var(--shade);font-family:var(--font-display);font-size:14px;padding:0;cursor:pointer}
.keys button.on{background:var(--ink);color:var(--surface)}
.pbar{height:12px;border:2px solid var(--line);background:var(--surface)}.pbar i{display:block;height:100%;background:var(--accent)}
.login{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:14px}

/* ───── a real phone: no frame, safe areas ───── */
@media (max-width:520px){
  body{background:var(--bg)}
  .viewer{display:block;padding:0}
  .index,.notes,.island,.hind,.sb,.frame-only{display:none}
  .phone{width:100vw;height:100dvh;border-radius:0;box-shadow:none;--safe-top:env(safe-area-inset-top,0px);--safe-bot:max(env(safe-area-inset-bottom,0px),8px)}
  .top{padding-top:calc(5px + env(safe-area-inset-top,0px))}
}
</style>
</head>
<body>
<div class="viewer">
  <nav class="index" id="index"></nav>
  <div class="phone" id="phone">
    <div class="island"></div><div class="hind"></div>
    <div class="sb"><span>10:30</span><span>5G ▮▮▮</span></div>
    <div class="view" id="view"></div>
    <div class="ov" id="ov"></div>
  </div>
  <aside class="notes" id="notes"></aside>
</div>

<script>
/* ───── tiny helpers shared by the screen files ───── */
const M=window.M={screens:{},sheets:{},order:[],cur:null,state:{}};
const $=(s,r=document)=>r.querySelector(s);
const ICONS={
 overview:['11100111','10100101','11100111','00000000','11100111','10100101','11100111','00000000'],

 users:['00111100','01111110','01111110','00111100','00000000','11111111','11111111','11111111'],
 docker:['00110000','00110000','11011011','11011011','00000000','11111111','11111111','01111110'],
 more:['00000000','00000000','11011011','11011011','00000000','00000000','00000000','00000000'],
 plus:['00011000','00011000','00011000','11111111','11111111','00011000','00011000','00011000'],
 back:['00001000','00011000','00111000','01111111','01111111','00111000','00011000','00001000'],
 x:['10000001','11000011','01100110','00111100','00111100','01100110','11000011','10000001'],
 search:['01111000','10000100','10000100','10000100','01111000','00000110','00000011','00000001'],
 cards:['11111111','10000001','11111111','00000000','11111111','10000001','11111111','00000000'],
 map:['11011011','11011011','00000000','11011011','11011011','00000000','11011011','11011011'],
 gear:['00100100','01111110','11000011','11011011','11011011','11000011','01111110','00100100'],
 next:['00000000','01100000','00110000','00011000','00011000','00110000','01100000','00000000'],
 chev:['00000000','00000000','11000011','01100110','00111100','00011000','00000000','00000000'],
 up:['00000000','00000000','00011000','00111100','01100110','11000011','00000000','00000000'],
 audit:['11111110','10000010','10111010','10000010','10111010','10000010','11111110','00000000'],
 key:['00111100','01000010','01000010','00111100','00011000','00011100','00011000','00011100'],
 trash:['00111100','11111111','00000000','01111110','01011010','01011010','01011010','01111110'],
 bolt:['00001110','00011100','00111000','01111110','00001100','00011000','00110000','00100000'],
 play:['00100000','00110000','00111000','00111100','00111100','00111000','00110000','00100000'],
 stop:['00000000','01111110','01111110','01111110','01111110','01111110','01111110','00000000'],
 refresh:['00111100','01000010','10000000','10000100','10000000','10000010','01000010','00111100'],
 folder:['00000000','11110000','11111111','11111111','11111111','11111111','11111111','00000000'],
 file:['01111100','01000110','01000111','01000001','01000001','01000001','01000001','01111111'],
};
M.ic=(n,c='')=>`<svg class="ic ${c}" viewBox="0 0 8 8" shape-rendering="crispEdges" fill="currentColor">${(ICONS[n]||ICONS.more).map((r,y)=>[...r].map((v,x)=>v==='1'?`<rect x="${x}" y="${y}" width="1" height="1"/>`:'').join('')).join('')}</svg>`;
M.lvl=p=>p>90?'crit':p>75?'warn':'';
M.segs=(p,n=10,cls='')=>{const f=Math.round(p/100*n);return `<div class="segs ${M.lvl(p)} ${cls}">${Array.from({length:n},(_,i)=>`<i class="${i<f?'on':''}"></i>`).join('')}</div>`};
M.tag=(t,c='')=>`<span class="tag ${c}">${t}</span>`;
M.seg=(items,cur,cls='')=>`<div class="seg ${cls}">${items.map((t,i)=>`<button aria-pressed="${i===cur}">${t}</button>`).join('')}</div>`;
M.chk=(t,on)=>`<label class="chk"><i class="${on?'on':''}"></i><span>${t}</span></label>`;
M.rand=(seed)=>{let s=seed;return()=>(s=(s*9301+49297)%233280)/233280};
M.chart=(seed,col,{h=130,lo=20,hi=80,area=true,two=0}={})=>{
  const r=M.rand(seed),W=406,H=h,n=48,pts=(b,a)=>Array.from({length:n},(_,i)=>{const v=b+a*Math.sin(i/5+seed)+ (r()-.5)*a*.8;return[i*(W-34)/(n-1)+30,H-14-(Math.max(2,Math.min(98,v))/100)*(H-24)]});
  const path=p=>p.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join('');
  const a=pts((lo+hi)/2,(hi-lo)/2),pk=a.map(q=>[q[0],q[1]-6-r()*8]);
  let g='';[0,25,50,75,100].forEach(v=>{const y=H-14-v/100*(H-24);g+=`<line x1="30" x2="${W}" y1="${y}" y2="${y}" stroke="var(--seg-off)" stroke-width="1"/><text x="26" y="${y+4}" text-anchor="end" font-size="10" fill="var(--muted)">${v}</text>`});
  let b=`<svg class="chart" viewBox="0 0 ${W} ${H}">${g}`;
  if(area)b+=`<path d="${path(a)}L${W} ${H-14}L30 ${H-14}Z" fill="${col}" opacity=".14"/>`;
  b+=`<path d="${path(pk)}" fill="none" stroke="${col}" stroke-width="1" stroke-dasharray="3 3" opacity=".6"/><path d="${path(a)}" fill="none" stroke="${col}" stroke-width="2"/>`;
  if(two){const c=pts(lo/2,(hi-lo)/4);b+=`<path d="${path(c)}" fill="none" stroke="var(--series-2)" stroke-width="2"/>`}
  return b+'</svg>';
};
M.add=s=>{M.screens[s.id]=s;M.order.push(s.id)};
M.sheet=s=>{M.sheets[s.id]=s};

M.servers=[
 {n:'web-01',ip:'10.0.1.11',os:'Debian 12',ag:'0.3.2',lv:'ok',cpu:35,ram:52,dsk:41,upd:3,rx:'1.9 MB/s',tx:'615 KB/s'},

M.SRV_TABS=[['general','Основное',['overview','metrics','terminal']],['system','Система',['services','processes','logs','updates']],['fs','Файлы',['files','disk']],['net','Сеть и защита',['network','firewall','security','users']],['apps','Приложения',['docker']]];
M.TAB_NAMES={overview:'Обзор',metrics:'Метрики',terminal:'Терминал',services:'Службы',processes:'Процессы',logs:'Логи',updates:'Обновления',files:'Файлы',disk:'Диск',network:'Сеть',firewall:'Файрвол',security:'Безопасность',users:'Пользователи',docker:'Docker'};
M.TAB_BADGE={updates:['3','warn'],services:['1','crit'],security:['2','warn']};

/* ───── engine ───── */
function topbar(s){
  const t=s.top||{};
  if(t.brand)return `<header class="top"><div class="brand"><svg class="logo" viewBox="0 0 14 14" shape-rendering="crispEdges" aria-hidden="true"><rect width="14" height="14" rx="3" fill="#0f1218"/><rect x="2" y="3" width="2" height="2" fill="#e6e9ef"/><rect x="4" y="5" width="2" height="2" fill="#e6e9ef"/><rect x="6" y="7" width="2" height="2" fill="#e6e9ef"/><rect x="4" y="9" width="2" height="2" fill="#e6e9ef"/><rect x="8" y="10" width="4" height="2" fill="#7d9cff"/></svg><div class="ttl"><h1 style="font-size:24px">Linager</h1></div></div><div class="grow"></div>${t.actions||''}</header>`;
  return `<header class="top">${t.back?`<button class="ibtn flat" data-go="${t.back}" aria-label="Назад">${M.ic('back')}</button>`:''}<div class="ttl"><h1>${t.title||s.title}</h1>${t.sub?`<p>${t.sub}</p>`:''}</div>${t.actions||''}</header>`;
}
function tabbar(s){
  if(!s.tabs)return '';
  const it=s.tabs==='g'
    ?[['dash','overview','Серверы'],['updates','updates','Linager',['3']],['audit','audit','Журнал'],['settings','gear','Ещё']]
    :[['srv-overview','overview','Обзор'],['srv-terminal','terminal','Терминал'],['srv-files','files','Файлы'],['srv-services','services','Службы',['1','crit']],['#sections','more','Разделы']];
  return `<nav class="tabbar">${it.map(([go,ic,l,b])=>{
    const cur=s.tab===go||(go==='#sections'&&s.tabs==='s'&&!['srv-overview','srv-terminal','srv-files','srv-services'].includes(s.tab));
    return `<button class="tab" aria-current="${!!cur}" ${go[0]==='#'?`data-sheet="sections"`:`data-go="${go}"`}>${M.ic(ic)}<span>${l}</span>${b?`<em class="cnt ${b[1]||''}" style="font-style:normal">${b[0]}</em>`:''}</button>`}).join('')}</nav>`;
}
M.go=(id,keepScroll)=>{
  const s=M.screens[id];if(!s)return;M.cur=id;M.closeSheet();
  $('#view').innerHTML=topbar(s)+`<main class="scroll ${s.scrollCls||''}" id="scroll">${s.body()}</main>`+(s.dock?`<div class="dock ${s.tabs?'':'pad'} ${s.dockCls||''}" id="dock">${typeof s.dock==='function'?s.dock():s.dock}</div>`:'')+(s.kbd?`<div class="keys">${['Esc','Tab','Ctrl','Alt','←','↑','↓','→','|','/','~','-','_','&','*','Ещё'].map(k=>`<button class="${k==='Ctrl'?'on':''}">${k}</button>`).join('')}</div><div class="kbd">клавиатура iOS</div>`:'')+tabbar(s);
  $('#scroll').scrollTop=0;
  history.replaceState(null,'','#'+id);
  index();notes(s);if(s.after)s.after();
};
M.openSheet=id=>{
  const s=M.sheets[id];if(!s)return;
  $('#ov').innerHTML=`<div class="sheet ${s.full?'full':''}"><div class="sh"><h2>${s.title}</h2><button class="ibtn flat" data-close aria-label="Закрыть">${M.ic('x')}</button></div><div class="sb2" style="${s.flush?'padding:0':''}">${s.body()}</div>${s.foot?`<div class="sf">${s.foot}</div>`:''}</div>`;
  $('#ov').classList.add('on');M.sheetId=id;
};
M.closeSheet=()=>{$('#ov').classList.remove('on');M.sheetId=null};
function index(){
  const g={};M.order.forEach(id=>{const s=M.screens[id];(g[s.grp]=g[s.grp]||[]).push(s)});
  let h='<h2>Linager · телефон</h2><p class="muted small">iPhone 14 Pro Max, 430 × 932. Свайпов нет, всё на тапах. Оформление прежнее.</p><div class="viewer-btns"><button id="th">Тёмная тема</button></div>';
  for(const k in g)h+=`<h4>${k}</h4>`+g[k].map(s=>`<a class="${M.cur===s.id?'on':''}" data-go="${s.id}">${s.title}</a>`).join('');
  h+='<h4>Листы и окна</h4>'+Object.values(M.sheets).map(s=>`<a class="${M.sheetId===s.id?'on':''}" data-opensheet="${s.id}" data-under="${s.under||''}">${s.title}</a>`).join('');
  $('#index').innerHTML=h;
}
function notes(s){
  const n=s.notes||[];
  $('#notes').innerHTML=`<h3>${s.title}</h3>`+(s.was?`<div class="g">Сейчас</div><ul>${s.was.map(x=>`<li>${x}</li>`).join('')}</ul>`:'')+`<div class="g">Как в макете</div><ul>${n.map(x=>`<li>${x}</li>`).join('')}</ul>`;
}
document.addEventListener('click',e=>{
  const t=e.target;
  let a=t.closest('[data-go]');if(a){M.go(a.dataset.go);return}
  a=t.closest('[data-sheet]');if(a){M.openSheet(a.dataset.sheet);index();return}
  a=t.closest('[data-opensheet]');if(a){if(a.dataset.under&&M.cur!==a.dataset.under)M.go(a.dataset.under);M.openSheet(a.dataset.opensheet);index();return}
  a=t.closest('[data-close]');if(a||t.id==='ov'){M.closeSheet();index();return}
  a=t.closest('.seg button');if(a){[...a.parentNode.children].forEach(b=>b.setAttribute('aria-pressed',b===a));return}
  a=t.closest('.chk');if(a){a.querySelector('i').classList.toggle('on');e.preventDefault();return}
  a=t.closest('#th');if(a){const r=document.documentElement,d=r.dataset.theme==='dark';r.dataset.theme=d?'light':'dark';a.textContent=d?'Тёмная тема':'Светлая тема'}
});
M.start=()=>{if(/dark/.test(location.search))document.documentElement.dataset.theme='dark';const [h,sh]=location.hash.slice(1).split('!');M.go(h in M.screens?h:'dash');if(sh){M.openSheet(sh);index()}};
</script>
