<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Linager: site mockup (landing and documentation)</title>
<style>
@font-face{font-family:"Medeo Mono";src:url(../mockup/fonts/MedeoMonoVariable.woff2) format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:"Medeo Pixel";src:url(../mockup/fonts/MedeoPixelVariable.woff) format("woff");font-style:normal;font-display:swap}
:root{
  --bg:#e8ebe5;--surface:#f6f7f3;--ink:#14181e;--muted:#5d6572;--line:#14181e;--accent:#2b55d9;--good:#1e8a4b;--warn:#b36f0e;--crit:#c4352a;--seg-off:#d5d9d0;--shade:#c3c8bd;--term:#0f1218;--term-ink:#e6e9ef;
  --font-display:"Medeo Pixel","Medeo Mono",ui-monospace,Menlo,Consolas,monospace;
  --font-body:"Medeo Mono",ui-monospace,Menlo,Consolas,monospace;
  font-variation-settings:"ELSH" 1;font-synthesis:none;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1218;--surface:#171b23;--ink:#e6e9ef;--muted:#8a93a4;--line:#3b4455;--accent:#7d9cff;--good:#4fcf86;--warn:#e6b04b;--crit:#ff6d60;--seg-off:#272d39;--shade:#0a0c10;--term:#0a0c10;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1218;--surface:#171b23;--ink:#e6e9ef;--muted:#8a93a4;--line:#3b4455;--accent:#7d9cff;--good:#4fcf86;--warn:#e6b04b;--crit:#ff6d60;--seg-off:#272d39;--shade:#0a0c10;--term:#0a0c10;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6}
h1,h2,h3,h4,p,ul,ol,figure{margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.muted{color:var(--muted)}
.mono{font-family:var(--font-body)}

/* ---- header ---- */
.top{position:sticky;top:0;z-index:50;background:var(--surface);border-bottom:2px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;height:60px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--font-display);font-size:24px;line-height:1}
.brand svg{width:30px;height:30px;shape-rendering:crispEdges}
.nav{display:flex;gap:6px;margin-left:22px}
.nav a{display:inline-flex;align-items:center;height:36px;padding:0 14px;border:2px solid transparent;text-decoration:none;font-family:var(--font-display);font-size:16px}
.nav a:hover{border-color:var(--line)}
.nav a[aria-current=page]{background:var(--ink);color:var(--surface);border-color:var(--ink);box-shadow:3px 3px 0 var(--shade)}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:0;cursor:pointer;font-family:var(--font-display);font-size:16px;line-height:1;letter-spacing:.02em;box-shadow:3px 3px 0 var(--shade);text-decoration:none;white-space:nowrap;transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--shade)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shade)}
.btn.sm{height:32px;padding:0 10px;font-size:14px}
.btn.primary{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.btn.ink{background:var(--ink);color:var(--surface)}
.seg{display:inline-flex}
.seg button{height:32px;padding:0 10px;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-family:var(--font-display);font-size:14px}
.seg button+button{border-left:0}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--surface)}
.burger{display:none}

/* ---- common blocks ---- */
.card{background:var(--surface);border:2px solid var(--line);box-shadow:4px 4px 0 var(--shade)}
.eyebrow{font-family:var(--font-display);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.sec{padding:84px 0}
.sec h2{font-family:var(--font-display);font-weight:400;font-size:clamp(28px,4vw,44px);line-height:1.1;margin:8px 0 14px}
.sec .lead{max-width:640px;color:var(--muted);font-size:16px}
.badge{display:inline-block;padding:0 6px;border:2px solid currentColor;font-size:12px;line-height:1.4}
.dot{display:inline-block;width:8px;height:8px;background:currentColor}
.ok{color:var(--good)}.warn{color:var(--warn)}.crit{color:var(--crit)}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s ease,transform .6s ease;transition-delay:var(--d,0s)}
.reveal.in{opacity:1;transform:none}

/* pixel bar */
.pbar{display:grid;grid-template-columns:repeat(20,1fr);gap:2px;height:10px}
.pbar i{background:var(--seg-off);transition:background .25s}
.pbar i.on{background:var(--accent)}
.pbar.warn i.on{background:var(--warn)}
.pbar.crit i.on{background:var(--crit)}

/* ---- hero ---- */
.hero{position:relative;overflow:hidden;padding:72px 0 80px;border-bottom:2px solid var(--line)}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--seg-off) 1px,transparent 1px),linear-gradient(90deg,var(--seg-off) 1px,transparent 1px);background-size:28px 28px;opacity:.55;mask-image:radial-gradient(ellipse at 70% 40%,#000 0,transparent 70%);-webkit-mask-image:radial-gradient(ellipse at 70% 40%,#000 0,transparent 70%);pointer-events:none}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center}
.hero h1{font-family:var(--font-display);font-weight:400;font-size:clamp(38px,6vw,72px);line-height:1.02;letter-spacing:-.01em;margin:14px 0 20px}
.hero h1 .cur{display:inline-block;width:.5em;height:.8em;background:var(--accent);margin-left:6px;vertical-align:-.05em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.hero p.lead{font-size:17px;color:var(--muted);max-width:520px}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin:28px 0 22px}
.cmd{display:flex;align-items:center;gap:0;max-width:540px;background:var(--term);color:var(--term-ink);border:2px solid var(--line);box-shadow:4px 4px 0 var(--shade)}
.cmd code{flex:1;min-width:0;padding:10px 14px;font-size:12px;white-space:pre-wrap;word-break:break-all}
.cmd code b{color:#7d9cff;font-weight:400}
.cmd button{align-self:stretch;border:0;border-left:2px solid var(--line);background:var(--surface);color:var(--ink);padding:0 14px;cursor:pointer;font-family:var(--font-display);font-size:14px}
.cmd button:hover{background:var(--accent);color:var(--surface)}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:20px;font-size:12px;color:var(--muted)}

/* hero live dashboard */
.live{position:relative;transform:rotate(-1.2deg);animation:float 7s ease-in-out infinite}
@keyframes float{50%{transform:rotate(-1.2deg) translateY(-8px)}}
.live .bar{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:2px solid var(--line);font-size:12px;color:var(--muted)}
.live .bar i{width:10px;height:10px;border:2px solid var(--line);background:var(--seg-off)}
.live .bar span{margin-left:8px}
.live .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px}
.sc{border:2px solid var(--line);border-top-width:6px;padding:10px 12px;background:var(--surface)}
.sc.w{border-top-color:var(--warn)}.sc.c{border-top-color:var(--crit)}
.sc h4{font-family:var(--font-display);font-weight:400;font-size:18px;display:flex;align-items:center;gap:8px}
.sc .row{display:grid;grid-template-columns:34px 1fr 38px;gap:8px;align-items:center;font-size:11px;color:var(--muted);margin-top:6px}
.sc .row b{font-weight:400;color:var(--ink);text-align:right}
.sc .tag{font-size:11px;margin-top:6px}
.live .toast{position:absolute;right:-14px;bottom:-20px;background:var(--ink);color:var(--surface);padding:10px 14px;font-size:12px;box-shadow:4px 4px 0 var(--shade);animation:pop 6s ease-in-out infinite}
@keyframes pop{0%,8%{opacity:0;transform:translateY(10px)}14%,80%{opacity:1;transform:none}90%,100%{opacity:0;transform:translateY(10px)}}

/* ---- stats ---- */
.stats{background:var(--ink);color:var(--surface)}
.stats .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.stat{padding:30px 20px;border-left:2px solid #3b4455}
.stat:first-child{border-left:0}
.stat b{display:block;font-family:var(--font-display);font-weight:400;font-size:clamp(34px,4.4vw,52px);line-height:1}
.stat span{display:block;margin-top:8px;font-size:13px;color:#aab2c2}

/* ---- features ---- */
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:40px}
.feat{padding:20px;transition:transform .15s,box-shadow .15s}
.feat:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--shade)}
.feat .ic{width:44px;height:44px;border:2px solid var(--line);display:grid;place-items:center;background:var(--bg);margin-bottom:14px}
.feat .ic svg{width:26px;height:26px;shape-rendering:crispEdges;fill:var(--ink)}
.feat:hover .ic{background:var(--accent)}
.feat:hover .ic svg{fill:var(--surface)}
.feat h3{font-family:var(--font-display);font-weight:400;font-size:20px;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.feat p{color:var(--muted);font-size:14px}
.new{padding:0 6px;border:2px solid var(--accent);color:var(--accent);font-size:11px;letter-spacing:.04em;text-transform:uppercase;font-family:var(--font-body)}

/* ---- how it works ---- */
.how{background:var(--surface);border-block:2px solid var(--line)}
.diagram{margin-top:40px;padding:22px}
.diagram svg{display:block;width:100%;height:auto}
.diagram text{font-family:var(--font-body);font-size:12px;fill:var(--ink)}
.diagram .t{font-family:var(--font-display);font-size:16px}
.diagram .box{fill:var(--surface);stroke:var(--line);stroke-width:2}
.diagram .ln{stroke:var(--line);stroke-width:2;stroke-dasharray:6 6;fill:none;animation:dash 1.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-24}}
.diagram .pk{fill:var(--accent)}
.points{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:26px}
.points div{border-left:4px solid var(--accent);padding-left:14px;font-size:14px;color:var(--muted)}
.points b{display:block;color:var(--ink);font-family:var(--font-display);font-weight:400;font-size:17px;margin-bottom:2px}

/* ---- screenshots ---- */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:32px 0 18px}
.tabs button{height:36px;padding:0 14px;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-family:var(--font-display);font-size:15px;box-shadow:3px 3px 0 var(--shade)}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--surface)}
.shot{position:relative;overflow:hidden}
.shot .chrome{display:flex;gap:6px;align-items:center;padding:8px 12px;border-bottom:2px solid var(--line);font-size:12px;color:var(--muted)}
.shot .chrome i{width:10px;height:10px;border:2px solid var(--line)}
.shot .stage{position:relative;aspect-ratio:1600/1130;background:var(--bg)}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;opacity:0;transform:scale(1.015);transition:opacity .5s,transform .8s}
.shot img.on{opacity:1;transform:none}
.cap{margin-top:14px;color:var(--muted);font-size:14px;min-height:46px}

/* ---- access spotlight ---- */
.spot{display:grid;grid-template-columns:.9fr 1.1fr;gap:44px;align-items:center}
.checks{list-style:none;padding:0;margin:20px 0 0;display:grid;gap:10px}
.checks li{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.checks li::before{content:"";flex:none;width:14px;height:14px;margin-top:5px;background:var(--accent);clip-path:polygon(0 50%,35% 50%,35% 70%,70% 70%,70% 30%,100% 30%,100% 0,35% 0,35% 20%,0 20%)}
.checks li{position:relative}
.checks li::before{clip-path:polygon(0 55%,20% 40%,40% 62%,85% 10%,100% 25%,40% 90%)}

/* ---- install ---- */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:40px;counter-reset:s}
.step{padding:22px;position:relative}
.step::before{counter-increment:s;content:"0" counter(s);position:absolute;top:-16px;left:16px;background:var(--accent);color:var(--surface);font-family:var(--font-display);font-size:18px;padding:0 10px;border:2px solid var(--line)}
.step h3{font-family:var(--font-display);font-weight:400;font-size:20px;margin:4px 0 8px}
.step p{color:var(--muted);font-size:14px}
.term{margin-top:30px;background:var(--term);color:var(--term-ink);border:2px solid var(--line);box-shadow:4px 4px 0 var(--shade);font-size:13px}
.term .tb{display:flex;gap:6px;padding:8px 12px;border-bottom:2px solid #3b4455}
.term .tb i{width:10px;height:10px;border:2px solid #3b4455}
.term pre{margin:0;padding:16px;min-height:178px;white-space:pre-wrap;font-family:var(--font-body);line-height:1.55}
.term .g{color:#4fcf86}.term .b{color:#7d9cff}.term .m{color:#8a93a4}
.term .caret{display:inline-block;width:8px;height:15px;background:#7d9cff;vertical-align:-2px;animation:blink 1s steps(1) infinite}
.platforms{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.platforms span{border:2px solid var(--line);padding:2px 10px;font-size:13px;background:var(--surface)}

/* ---- cta + footer ---- */
.cta-band{background:var(--accent);color:#fff;border-block:2px solid var(--line);text-align:center;padding:64px 0}
.cta-band h2{font-family:var(--font-display);font-weight:400;font-size:clamp(28px,4vw,46px);margin-bottom:10px}
.cta-band p{opacity:.85;margin-bottom:24px}
.cta-band .btn{border-color:#fff}
footer.site{padding:36px 0;background:var(--surface);font-size:13px;color:var(--muted)}
footer.site .wrap{display:flex;flex-wrap:wrap;gap:16px 32px;justify-content:space-between;align-items:center}
footer.site nav{display:flex;gap:18px;flex-wrap:wrap}
footer.site a{text-decoration:none}
footer.site a:hover{color:var(--ink);text-decoration:underline}

/* ---- docs ---- */
.docs{display:grid;grid-template-columns:268px minmax(0,1fr) 220px;gap:36px;max-width:1380px;margin:0 auto;padding:28px 20px 60px;align-items:start}
.side,.toc{position:sticky;top:84px;max-height:calc(100vh - 104px);overflow:auto}
.side{background:var(--surface);border:2px solid var(--line);box-shadow:4px 4px 0 var(--shade);padding:12px}
.search{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--bg);padding:0 10px;height:38px;margin-bottom:12px}
.search input{flex:1;min-width:0;border:0;background:none;outline:0;font:inherit;font-size:13px;color:var(--ink)}
.search kbd{font-size:11px;border:2px solid var(--seg-off);padding:0 5px;color:var(--muted)}
.grp{margin-top:6px}
.grp h5{margin:10px 6px 4px;font-family:var(--font-display);font-weight:400;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.side a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;border:2px solid transparent;text-decoration:none;font-size:14px}
.side a:hover{border-color:var(--seg-off);background:var(--bg)}
.side a[aria-current=page]{background:var(--ink);color:var(--surface);border-color:var(--ink);box-shadow:3px 3px 0 var(--shade)}
.side a.hide{display:none}
.side .empty{padding:8px 10px;font-size:13px;color:var(--muted)}
article{min-width:0}
.crumbs{font-size:12px;color:var(--muted);margin-bottom:10px;display:flex;gap:8px;flex-wrap:wrap}
article h1{font-family:var(--font-display);font-weight:400;font-size:clamp(30px,4vw,44px);line-height:1.1;margin-bottom:12px}
article .lead{color:var(--muted);font-size:16px;margin-bottom:22px}
article h2{font-family:var(--font-display);font-weight:400;font-size:26px;margin:38px 0 10px;padding-top:6px;border-top:2px dashed var(--seg-off)}
article h3{font-family:var(--font-display);font-weight:400;font-size:20px;margin:26px 0 8px}
article p{margin:10px 0}
article ul,article ol{margin:10px 0;padding-left:22px}
article li{margin:4px 0}
article code{background:var(--surface);border:1px solid var(--seg-off);padding:1px 5px;font-size:.92em}
.pre{position:relative;margin:14px 0;background:var(--term);color:var(--term-ink);border:2px solid var(--line);box-shadow:3px 3px 0 var(--shade)}
.pre pre{margin:0;padding:14px 16px;overflow-x:auto;font-size:13px;line-height:1.55;font-family:var(--font-body)}
.pre button{position:absolute;top:8px;right:8px;height:26px;padding:0 8px;border:2px solid #3b4455;background:var(--surface);color:var(--ink);cursor:pointer;font-family:var(--font-display);font-size:12px;opacity:0;transition:opacity .15s}
.pre:hover button,.pre button:focus{opacity:1}
.pre .c{color:#8a93a4}.pre .k{color:#7d9cff}.pre .s{color:#4fcf86}
.note{margin:16px 0;padding:12px 14px;border:2px solid var(--accent);background:var(--surface);font-size:14px}
.note.warn{border-color:var(--warn)}
.note b{font-family:var(--font-display);font-weight:400;display:block;margin-bottom:2px;color:var(--accent)}
.note.warn b{color:var(--warn)}
table.t{width:100%;border-collapse:collapse;margin:14px 0;font-size:14px}
table.t th{font-family:var(--font-display);font-weight:400;text-align:left;border-bottom:2px solid var(--line);padding:6px 10px;color:var(--muted);font-size:13px}
table.t td{padding:8px 10px;border-bottom:1px dashed var(--seg-off);vertical-align:top}
article img.fig{display:block;width:100%;border:2px solid var(--line);box-shadow:4px 4px 0 var(--shade);margin:16px 0}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:44px}
.pn a{display:block;padding:12px 16px;border:2px solid var(--line);background:var(--surface);text-decoration:none;box-shadow:3px 3px 0 var(--shade);transition:transform .1s,box-shadow .1s}
.pn a:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--shade)}
.pn a small{display:block;color:var(--muted);font-size:12px}
.pn a b{font-family:var(--font-display);font-weight:400;font-size:18px}
.pn a.next{text-align:right}
.toc{font-size:13px;border-left:2px solid var(--seg-off);padding-left:14px}
.toc h5{margin:0 0 8px;font-family:var(--font-display);font-weight:400;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.toc a{display:block;padding:3px 0;color:var(--muted);text-decoration:none;border-left:2px solid transparent;margin-left:-16px;padding-left:14px}
.toc a.l3{padding-left:26px;font-size:12px}
.toc a:hover{color:var(--ink)}
.toc a.on{color:var(--accent);border-left-color:var(--accent)}
.stubnote{margin-top:24px;padding:20px;border:2px dashed var(--seg-off);color:var(--muted)}

/* ---- responsive ---- */
@media (max-width:1100px){.docs{grid-template-columns:240px minmax(0,1fr)}.toc{display:none}}
@media (max-width:900px){
  .hero .wrap,.spot{grid-template-columns:1fr}
  .live{max-width:520px}
  .fgrid{grid-template-columns:1fr 1fr}
  .stats .wrap{grid-template-columns:1fr 1fr}.stat:nth-child(3){border-left:0}.stat:nth-child(n+3){border-top:2px solid #3b4455}
  .steps,.points{grid-template-columns:1fr}
  .docs{grid-template-columns:1fr}.side{position:static;max-height:none}
}
@media (max-width:640px){
  .fgrid{grid-template-columns:1fr}
  .top .wrap{height:auto;flex-wrap:wrap;gap:8px;padding-top:8px;padding-bottom:8px}.hide-s{display:none}
  .nav{order:5;width:100%;margin-left:0}.nav a{flex:1;justify-content:center;border-color:var(--seg-off)}
  .sec{padding:56px 0}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .reveal{opacity:1;transform:none}
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#/" aria-label="Linager">
      <svg viewBox="0 0 14 14"><rect width="14" height="14" rx="3" fill="#0f1218"/><rect x="2" y="3" width="2" height="2" fill="#e6e9ef"/><rect x="4" y="5" width="2" height="2" fill="#e6e9ef"/><rect x="6" y="7" width="2" height="2" fill="#e6e9ef"/><rect x="4" y="9" width="2" height="2" fill="#e6e9ef"/><rect x="8" y="10" width="4" height="2" fill="#7d9cff"/></svg>
      Linager
    </a>
    <nav class="nav" aria-label="Main">
      <a href="#/" id="nHome" data-i="nav.home">Home</a>
      <a href="#/docs/introduction" id="nDocs" data-i="nav.docs">Documentation</a>
    </nav>

var DOC={
en:{
 "introduction":function(){return '<p class="lead">Linager is an open-source system for managing Debian and Ubuntu servers: a server with a web admin panel and lightweight agents on the managed hosts.</p>'
  +'<h2 id="what">What you get</h2><ul><li>Live metrics every 5 seconds and history up to 360 days.</li><li>A web terminal, a file manager, systemd services, processes and logs.</li><li>apt updates, network and firewall editing with an automatic rollback, Docker.</li><li>Roles, 2FA, passkeys and an audit log of every administrator action.</li></ul>'
  +'<div class="note"><b>One binary</b>The same <code>linager</code> binary is the server or the agent. You pick the role during installation.</div>'
  +'<h2 id="how">How it fits together</h2><p>The server keeps its data in a local PostgreSQL and serves the panel. Each agent opens an outgoing mutual-TLS connection to the server, so managed hosts need no open inbound port.</p>'
  +'<img class="fig" alt="" src="../../screenshots/'+lang+'/server-overview.png">'
  +'<h3 id="platforms">Supported platforms</h3><table class="t"><tr><th>System</th><th>Server</th><th>Agent</th></tr><tr><td>Debian 12, 13</td><td>amd64</td><td>amd64, arm64</td></tr><tr><td>Ubuntu 22.04, 24.04, 26.04</td><td>amd64</td><td>amd64, arm64</td></tr></table>'
  +'<h2 id="next">Where to go next</h2><p>Start with <a href="#/docs/installation">Installation</a>, then <a href="#/docs/first-server">add your first server</a>.</p>'},
 "installation":function(){return '<p class="lead">Install the server on a clean Debian or Ubuntu host. The wizard sets up PostgreSQL, the keys, the administrator account and the service.</p>'
  +'<h2 id="quick">Quick start</h2>'+code('<span class="k">curl</span> -fsSL https://raw.githubusercontent.com/bolgov0zero/linager/main/install.sh | <span class="k">sh</span>')
  +'<p>The wizard first asks for the role: <b>Server</b> or <b>Client</b>. For the server it then asks for the client port and how the admin panel is reached.</p>'
  +'<div class="note warn"><b>Check before you pipe</b>Prefer to read the script first? Download it, verify the checksum and signature, then run it. See the safe variant below.</div>'
  +'<h3 id="safe">Safe variant</h3>'+code('<span class="c"># download, inspect, run</span>\ncurl -fsSLo install.sh https://raw.githubusercontent.com/bolgov0zero/linager/main/install.sh\nless install.sh\nsudo sh install.sh')
  +'<h2 id="modes">Admin panel modes</h2><table class="t"><tr><th>Mode</th><th>Use when</th></tr><tr><td>Caddy on this server</td><td>You have a domain; Let\'s Encrypt is configured for you.</td></tr><tr><td>Own reverse proxy</td><td>nginx, Caddy or Nginx Proxy Manager already runs elsewhere.</td></tr></table>'
  +'<h2 id="unattended">Unattended</h2>'+code('sudo linager install server --no-tui --agent-port 9443 --admin-mode proxy --admin-port 8080 --admin-user admin')},
 "first-server":function(){return '<p class="lead">Add a managed host in three steps. The agent connects out to the server, so the host needs no open inbound port.</p>'
  +'<h2 id="install-agent">1. Install the agent</h2>'+code('sudo linager install agent --server 10.0.0.5:9443')
  +'<h2 id="pair">2. Pair</h2><p>The agent shows a <b>key</b> and a <b>check code</b>. Open the panel, click <b>+ Server</b>, enter the key and make sure both codes match.</p>'
  +'<div class="note"><b>Why a check code?</b>It proves that the agent talks to your server and not to a man in the middle.</div>'
  +'<h2 id="done">3. Done</h2><p>After you confirm, the agent receives its certificate and starts as a systemd service. The server appears on the dashboard.</p>'},
 "reverse-proxy":function(){return '<p class="lead">Put the admin panel behind Caddy, nginx or Nginx Proxy Manager. The proxy must pass WebSocket traffic and the <code>X-Forwarded-*</code> headers.</p>'
  +'<h2 id="caddy">Caddy</h2>'+code('linager.example.com {\n\tencode zstd gzip\n\t<span class="k">reverse_proxy</span> 10.0.0.5:8080\n}')
  +'<h2 id="npm">Nginx Proxy Manager</h2><ul><li><b>Details:</b> scheme <code>http</code>, forward to the Linager host and the panel port. Turn on <b>Websockets Support</b>.</li><li><b>SSL:</b> pick a certificate, turn on Force SSL.</li><li><b>Advanced:</b> <code>proxy_buffering off;</code></li></ul>'
  +'<div class="note warn"><b>Agents do not use the proxy</b>The client port cannot pass through a proxy: agents connect to it directly.</div>'
  +'<h2 id="trusted">Trusted proxies</h2><p>Add the proxy under <a href="#/docs/admin-access">Settings → Admin access</a>, so the real visitor address is read from <code>X-Forwarded-For</code>.</p>'},
 "admin-access":function(){return '<p class="lead">Restrict who may open the admin panel with a white or black list, judged by the real client address.</p>'
  +'<h2 id="modes">Modes</h2><table class="t"><tr><th>Mode</th><th>Behavior</th></tr><tr><td>Off</td><td>The panel is open to everybody who reaches the port.</td></tr><tr><td>White list</td><td>Whatever is not listed is refused.</td></tr><tr><td>Black list</td><td>Whatever is not listed is allowed.</td></tr></table>'
  +'<img class="fig" alt="" src="../../screenshots/'+lang+'/access-restriction.png">'
  +'<h2 id="proxies">Trusted proxies</h2><p>The server believes <code>X-Forwarded-For</code> only from the proxies you list. A connection from any other address is judged by its own address, so the local network can connect directly.</p>'
  +'<div class="note warn"><b>Do not skip this</b>If the proxy is not trusted and the white list holds your whole local network, every visitor looks like the proxy and the internet gets in. The panel refuses to save such settings.</div>'
  +'<h2 id="journal">Access journal</h2><p>Page opens, sign-ins and refused requests are recorded with the client address and the proxy they came through. Keep them for 7, 30 or 90 days.</p>'
  +'<h2 id="reset">If you lock yourself out</h2>'+code('sudo linager access reset')+'<p>The restriction turns off, the lists stay. A running server applies it within seconds.</p>'},
 "security":function(){return '<p class="lead">How Linager protects your servers, and what it expects from you.</p>'
  +'<h2 id="model">What is protected</h2><ul><li>mTLS between the server and agents, signed messages, a pinned server fingerprint.</li><li>Passwords hashed with Argon2id, optional mandatory 2FA, passkeys, recovery codes.</li><li>Dangerous actions need confirmation on the server; agents refuse them without it.</li><li>Network and firewall changes roll back on their own after 30 seconds.</li></ul>'
  +'<h2 id="todo">What you should do</h2><ol><li>Turn on 2FA.</li><li>Set the trusted proxies and, if you like, an access list.</li><li>Open the client port only for the networks that need it.</li><li>Store backups as secrets: they contain the CA keys.</li></ol>'}
},
ru:{
 "introduction":function(){return '<p class="lead">Linager — открытая система управления серверами на Debian и Ubuntu: сервер с веб-админкой и лёгкие агенты на управляемых серверах.</p>'

 "installation":function(){return '<p class="lead">Установите сервер на чистый Debian или Ubuntu. Мастер настроит PostgreSQL, ключи, учётную запись администратора и службу.</p>'

 "first-server":function(){return '<p class="lead">Добавьте управляемый сервер за три шага. Агент подключается к серверу сам, поэтому открытый входящий порт не нужен.</p>'

 "reverse-proxy":function(){return '<p class="lead">Поставьте админку за Caddy, nginx или Nginx Proxy Manager. Прокси должен передавать WebSocket и заголовки <code>X-Forwarded-*</code>.</p>'

 "admin-access":function(){return '<p class="lead">Ограничьте, кто может открыть админку, белым или чёрным списком по реальному адресу клиента.</p>'

 if(!docs&&h==="install"&&document.getElementById("install")){document.getElementById("install").scrollIntoView();return}
 clearInterval(liveTimer);typeRun++;
 if(docs){
  var slug=h.split("/")[2]||"introduction";
  app.innerHTML=renderDocs(slug);afterDocs();window.scrollTo(0,0);document.title="Linager · "+tt("p."+(FLAT.indexOf(slug)>=0?slug:"introduction"));
 }else{
  app.innerHTML=landing();afterLanding();document.title="Linager";
  if(h==="install"){var el=document.getElementById("install");if(el)el.scrollIntoView()}else window.scrollTo(0,0);
 }
}
function afterLanding(){
 paintLive();liveTimer=setInterval(tickLive,1400);
 var io=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting){en.target.classList.add("in");io.unobserve(en.target)}})},{threshold:.15});
 document.querySelectorAll(".reveal").forEach(function(el){io.observe(el)});
 var co=new IntersectionObserver(function(es){es.forEach(function(en){if(!en.isIntersecting)return;co.unobserve(en.target);var el=en.target,to=+el.dataset.count,t0=performance.now();(function f(t){var p=Math.min(1,(t-t0)/1100),e=1-Math.pow(1-p,3);el.textContent=Math.round(to*e);if(p<1)requestAnimationFrame(f)})(t0)})},{threshold:.6});
 document.querySelectorAll("[data-count]").forEach(function(el){co.observe(el)});
 var to=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting){to.disconnect();runTyped()}})},{threshold:.4});
 var tp=document.getElementById("typed");if(tp)to.observe(tp);
 var tabsEl=document.querySelectorAll(".tabs button"),caps=["s.c1","s.c2","s.c3","s.c4","s.c5"],cur=0,auto=null;
 function pick(n){cur=n;tabsEl.forEach(function(b,i){b.setAttribute("aria-selected",i===n)});document.querySelectorAll("#stage img").forEach(function(im,i){im.classList.toggle("on",i===n)});document.getElementById("cap").textContent=tt(caps[n])}
 tabsEl.forEach(function(b,i){b.addEventListener("click",function(){clearInterval(auto);pick(i)})});
 var so=new IntersectionObserver(function(es){es.forEach(function(en){clearInterval(auto);if(en.isIntersecting&&!matchMedia("(prefers-reduced-motion:reduce)").matches)auto=setInterval(function(){pick((cur+1)%caps.length)},4500)})},{threshold:.4});
 var st=document.getElementById("stage");if(st)so.observe(st);
}

/* ============ global events ============ */
document.addEventListener("click",function(e){
 var c=e.target.closest("[data-copy]");
 if(c){navigator.clipboard&&navigator.clipboard.writeText(c.dataset.copy).catch(function(){});var o=c.textContent;c.textContent=tt("copied");setTimeout(function(){c.textContent=o},1400);return}
 var b=e.target.closest("[data-copyblock]");
 if(b){var txt=b.parentNode.querySelector("pre").textContent;navigator.clipboard&&navigator.clipboard.writeText(txt).catch(function(){});var o2=b.textContent;b.textContent=tt("copied");setTimeout(function(){b.textContent=o2},1400)}
 var l=e.target.closest("[data-lang]");
 if(l){setLang(l.dataset.lang)}
});
document.addEventListener("keydown",function(e){if(e.key==="/"&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){var q=document.getElementById("q");if(q){e.preventDefault();q.focus()}}});
function setLang(l){lang=l;document.documentElement.lang=l;document.querySelectorAll("[data-lang]").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.lang===l)});
 document.querySelectorAll("[data-i]").forEach(function(el){el.textContent=tt(el.dataset.i)});route()}
document.getElementById("theme").addEventListener("click",function(){var r=document.documentElement,d=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=d?"light":"dark"});
window.addEventListener("hashchange",route);
setLang("en");
})();
</script>
