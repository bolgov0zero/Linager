name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    # the agent runs on arm64 (Raspberry Pi), so the tests run there too
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: linager
          POSTGRES_DB: linager_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U linager" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LINAGER_TEST_DSN: postgres://linager@127.0.0.1:5432/linager_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web
        run: cd web && npm ci && npm run check && npm run build
      - name: Vet and test
        run: go vet ./... && go test -race ./...
      - uses: golangci/golangci-lint-action@v8
        if: matrix.runner == 'ubuntu-24.04'
        with:
          version: latest
      - name: Build linux/amd64 and linux/arm64
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/linager
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/linager
  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install.sh
  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go vulnerability scan
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit (production dependencies)
        run: cd web && npm audit --omit=dev --audit-level=high
