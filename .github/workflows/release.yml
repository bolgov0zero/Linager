name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: make build VERSION="${GITHUB_REF_NAME}"
      - name: Package .deb
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          VERSION="${GITHUB_REF_NAME#v}" "$(go env GOPATH)/bin/nfpm" package -f packaging/nfpm.yaml -p deb -t bin/linager_amd64.deb
      - name: Manifest and checksums
        run: |
          git fetch --tags --force
          sh packaging/make-manifest.sh "${GITHUB_REF_NAME}"
          cd bin && sha256sum linager_linux_amd64 linager_amd64.deb > SHA256SUMS
      - name: Sign (minisign)
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          if [ -z "$MINISIGN_KEY" ]; then echo "UNSIGNED=1" >> "$GITHUB_ENV"; exit 0; fi
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          umask 077
          printf '%s\n' "$MINISIGN_KEY" > "$RUNNER_TEMP/min.key"
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$RUNNER_TEMP/min.key" -m bin/SHA256SUMS
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$RUNNER_TEMP/min.key" -m bin/manifest.json
          rm -f "$RUNNER_TEMP/min.key"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease";; esac
          files="bin/linager_linux_amd64 bin/linager_amd64.deb bin/SHA256SUMS bin/manifest.json"
          if [ -n "${UNSIGNED:-}" ]; then flags="--prerelease"; else files="$files bin/SHA256SUMS.minisig bin/manifest.json.minisig"; fi
          # shellcheck disable=SC2086
          gh release create "$GITHUB_REF_NAME" $flags --generate-notes $files
